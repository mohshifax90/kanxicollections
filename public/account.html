<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Kanxi Collection — My Account</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f4f6;--panel:#fff;--soft:#f8fafc;--blue:#4f5cf0;--blue-dark:#4250ec;--green:#0f9f62;--amber:#d97706}
    body{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    button,input,select,textarea{font:inherit}
    .app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(17,24,39,.08)}
    .head{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.75rem;padding:.95rem 1rem;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .icon-btn{width:42px;height:42px;border:none;background:none;border-radius:999px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
    .title{flex:1;text-align:center;font-size:1.04rem;font-weight:800;margin-right:42px}
    .hero{padding:1.2rem 1rem;background:#f8fafc;border-bottom:1px solid var(--line)}
    .hero-row{display:flex;align-items:center;gap:.9rem}
    .avatar{width:62px;height:62px;border-radius:999px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:1.15rem;font-weight:800;color:var(--blue);flex-shrink:0}
    .hero-name{font-size:1.18rem;font-weight:800}
    .hero-sub{font-size:.88rem;color:var(--muted);margin-top:.15rem}
    .tabs{display:flex;position:sticky;top:62px;z-index:35;background:#fff;border-bottom:1px solid var(--line)}
    .tab{flex:1;border:none;background:none;padding:.95rem .5rem;font-size:.87rem;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
    .tab.active{color:var(--ink);border-bottom-color:var(--blue)}
    .panel{display:none;padding:1rem}
    .panel.active{display:block}
    .card{border:1px solid var(--line);border-radius:22px;background:#fff;padding:1rem}
    .stack{display:grid;gap:1rem}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.9rem}
    .section-title h2{font-size:1rem;font-weight:800}
    .muted{font-size:.84rem;color:var(--muted);line-height:1.45}
    .row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
    .row:last-child{border-bottom:none;padding-bottom:0}
    .row:first-child{padding-top:0}
    .k{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .v{text-align:right;font-size:.92rem;font-weight:600}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:none;border-radius:14px;padding:.9rem 1rem;font-weight:800;cursor:pointer}
    .btn-primary{background:var(--blue);color:#fff}
    .btn-primary:hover{background:var(--blue-dark)}
    .btn-light{background:#f3f4f6;color:var(--ink)}
    .btn-line{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .btn-block{width:100%}
    .address-card{border:1px solid var(--line);border-radius:20px;padding:1rem;background:#fff}
    .address-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
    .address-name{font-size:.96rem;font-weight:800}
    .badges{display:flex;flex-wrap:wrap;gap:.4rem;margin:.45rem 0 .6rem}
    .badge{display:inline-flex;align-items:center;gap:.28rem;padding:.26rem .55rem;border-radius:999px;font-size:.7rem;font-weight:800}
    .badge-default{background:#e8f7ee;color:var(--green)}
    .badge-type{background:#eef2ff;color:var(--blue)}
    .addr-lines{font-size:.86rem;color:var(--muted);line-height:1.55}
    .boat-box{margin-top:.75rem;padding:.8rem;border-radius:16px;background:#fbfcff;border:1px solid #dbe5ff}
    .boat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:.55rem}
    .boat-grid .full{grid-column:1 / -1}
    .kv small{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.18rem}
    .kv span{font-size:.84rem;font-weight:600;color:var(--ink)}
    .actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
    .editor{border:1px solid var(--line);border-radius:22px;background:#fff;padding:1rem}
    .editor h3{font-size:1rem;font-weight:800;margin-bottom:.9rem}
    .field{margin-bottom:.85rem}
    .field label{display:flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.4rem}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:.88rem .95rem;outline:none;background:#fff}
    .field textarea{min-height:88px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
    .switch-row{display:flex;align-items:center;gap:.7rem;padding:.85rem .95rem;border:1px solid var(--line);border-radius:14px}
    .switch-row input{width:18px;height:18px}
    .helper{font-size:.8rem;color:var(--muted);line-height:1.45;margin-top:.2rem}
    .order{border:1px solid var(--line);border-radius:18px;padding:1rem;background:#fff}
    .order-top{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.7rem}
    .order-id{font-family:ui-monospace,monospace;font-size:.78rem;color:var(--muted)}
    .pill{display:inline-flex;align-items:center;padding:.24rem .6rem;border-radius:999px;font-size:.7rem;font-weight:800}
    .order-item{display:flex;gap:.7rem;align-items:center;padding:.45rem 0}
    .order-item img{width:46px;height:54px;border-radius:12px;object-fit:cover;background:var(--soft)}
    .order-item .nm{font-size:.85rem;font-weight:600}
    .order-item .mt{font-size:.76rem;color:var(--muted)}
    .order-foot{display:flex;justify-content:space-between;margin-top:.6rem;padding-top:.7rem;border-top:1px solid var(--line);font-size:.9rem;font-weight:700}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem .8rem}
    .pcard-img{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--soft);border:1px solid var(--line);margin-bottom:.45rem}
    .pcard-img img{width:100%;height:100%;object-fit:cover}
    .pcard-badge{position:absolute;left:.5rem;bottom:.5rem;background:rgba(17,24,39,.78);color:#fff;font-size:.66rem;font-weight:800;padding:.24rem .5rem;border-radius:999px}
    .pcard-name{font-size:.84rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pcard-price{font-size:.86rem;font-weight:800;margin-top:.18rem}
    .empty{text-align:center;color:var(--muted);padding:3rem 1rem}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(2rem);background:#111827;color:#fff;padding:.8rem 1.2rem;border-radius:12px;font-size:.84rem;z-index:100;opacity:0;transition:.25s}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    @media (min-width:520px){body{padding:0;background:#fff}.app{border-radius:0;min-height:100vh;box-shadow:none}}
  </style>
</head>
<body>
<div class="app">
  <div class="head">
    <button class="icon-btn" onclick="location.href='index.html'" aria-label="Back"><i data-lucide="chevron-left"></i></button>
    <div class="title">My Account</div>
  </div>

  <div class="hero" id="hero"></div>

  <div class="tabs">
    <button class="tab" data-tab="details" onclick="showTab('details')">Details</button>
    <button class="tab" data-tab="orders" onclick="showTab('orders')">Orders</button>
    <button class="tab" data-tab="offers" onclick="showTab('offers')">Offers</button>
  </div>

  <div class="panel" id="panel-details"></div>
  <div class="panel" id="panel-orders"></div>
  <div class="panel" id="panel-offers"></div>
</div>

<script src="assets/icons.js?v=2"></script>
<script src="assets/supabase-config.js?v=2"></script>
<script src="assets/store.js?v=16"></script>
<script>
  const $ = s => document.querySelector(s);
  const MVR = n => 'MVR ' + (+n).toLocaleString();
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const phoneKey = value => Store.phoneKey ? Store.phoneKey(value) : String(value || '').replace(/\D/g,'');
  let u = Store.currentUser();
  let editingAddressId = null;
  let geoDraft = null;
  if(!u) location.href = 'login.html?redirect=account.html';

  function icons(){ if(window.lucide) lucide.createIcons(); }
  function showToast(msg){
    let t = document.getElementById('toast');
    if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
  }
  function syncUser(){
    const session = Store.currentUser();
    const users = Store.list('users');
    u = users.find(x => session && x.id===session.id) || users.find(x => session && phoneKey(x.phone)===phoneKey(session.phone)) || session;
    if(!u) location.href = 'login.html?redirect=account.html';
    Store.login(u);
  }
  function initials(name){
    return (name || 'User').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
  }
  function deliveryLabel(type){
    return ({
      standard:'Standard',
      speed_boat:'Speed Boat',
      boat:'Boat'
    })[type] || 'Standard';
  }
  function deliveryIcon(type){
    return type === 'speed_boat' ? 'ship-wheel' : type === 'boat' ? 'ship' : 'map-pinned';
  }
  function tone(status){
    const map = {
      'Pending Payment':['#fdf3e3','#d97706'],
      'Pending Slip Verification':['#fdf3e3','#d97706'],
      'Paid':['#eef2ff','#4f5cf0'],
      'Order Accepted':['#eef2ff','#4f5cf0'],
      'Packing':['#f5f3ff','#7c3aed'],
      'Ready to Dispatch':['#f5f3ff','#7c3aed'],
      'Out for Delivery':['#eef2ff','#4f5cf0'],
      'Delivered':['#e8f7ee','#0f9f62'],
      'Returned':['#feeceb','#dc2626']
    };
    return map[status] || ['#f3f4f6','#6b7280'];
  }
  function renderHero(){
    $('#hero').innerHTML = `
      <div class="hero-row">
        <div class="avatar">${initials(u.name)}</div>
        <div>
          <div class="hero-name">${esc(u.name || 'Kanxi Customer')}</div>
          <div class="hero-sub">${esc(u.phone || '')}</div>
        </div>
      </div>`;
  }
  function primaryAddress(){
    return (u.addresses||[]).find(a=>a.isDefault) || (u.addresses||[])[0] || null;
  }
  function addressSummary(a){
    const parts = [a.line, [a.city,a.atoll].filter(Boolean).join(', '), [a.postcode,a.country].filter(Boolean).join(' · ')].filter(Boolean);
    return parts.join('<br/>');
  }
  function boatFieldsVisible(type){
    return type === 'speed_boat' || type === 'boat';
  }
  function detailsSummaryCard(){
    const a = primaryAddress();
    return `<div class="card">
      <div class="section-title"><h2>Profile</h2></div>
      <div class="row"><div class="k">Full name</div><div class="v">${esc(u.name || '—')}</div></div>
      <div class="row"><div class="k">Mobile</div><div class="v">${esc(u.phone || '—')}</div></div>
      <div class="row"><div class="k">Gender</div><div class="v">${esc(u.gender || '—')}</div></div>
      <div class="row"><div class="k">Date of birth</div><div class="v">${esc(u.dob || '—')}</div></div>
      <div class="row"><div class="k">Default delivery</div><div class="v">${a ? `${esc(a.label)} · ${deliveryLabel(a.deliveryType)}` : 'Not set'}</div></div>
    </div>`;
  }
  function addressCard(a){
    const boat = a.deliveryInfo || {};
    return `<div class="address-card">
      <div class="address-top">
        <div>
          <div class="address-name">${esc(a.label || 'Address')}</div>
          <div class="badges">
            ${a.isDefault ? `<span class="badge badge-default"><i data-lucide="badge-check" style="width:12px;height:12px"></i>Default</span>` : ''}
            <span class="badge badge-type"><i data-lucide="${deliveryIcon(a.deliveryType)}" style="width:12px;height:12px"></i>${deliveryLabel(a.deliveryType)}</span>
          </div>
        </div>
      </div>
      <div class="addr-lines">${addressSummary(a) || 'No address details saved yet.'}</div>
      ${boatFieldsVisible(a.deliveryType) ? `<div class="boat-box">
        <div class="k" style="margin-bottom:.2rem">Boat Delivery</div>
        <div class="boat-grid">
          <div class="kv"><small>Boat Name</small><span>${esc(boat.boatName || '—')}</span></div>
          <div class="kv"><small>Contact</small><span>${esc(boat.contactNumber || '—')}</span></div>
          <div class="kv"><small>Departure</small><span>${esc(boat.departureTime || '—')}</span></div>
          <div class="kv full"><small>Note</small><span>${esc(boat.note || '—')}</span></div>
        </div>
      </div>` : ''}
      <div class="actions">
        <button class="btn btn-line" onclick="openAddressEditor('${a.id}')"><i data-lucide="square-pen" style="width:16px;height:16px"></i><span>Edit</span></button>
        ${!a.isDefault ? `<button class="btn btn-light" onclick="setDefaultAddress('${a.id}')"><i data-lucide="star" style="width:16px;height:16px"></i><span>Make default</span></button>` : ''}
      </div>
    </div>`;
  }
  function addressEditor(){
    const existing = editingAddressId ? (u.addresses||[]).find(a=>a.id===editingAddressId) : null;
    const a = existing || {
      id:'',
      label:'Home',
      line:'',
      city:'',
      atoll:'',
      postcode:'',
      country:'Maldives',
      isDefault:!(u.addresses||[]).length,
      deliveryType:'standard',
      deliveryInfo:{ boatName:'', contactNumber:'', departureTime:'', note:'' }
    };
    const boat = a.deliveryInfo || {};
    return `<div class="editor">
      <h3>${existing ? 'Edit address' : 'Add new address'}</h3>
      <div class="field"><label><i data-lucide="tag" style="width:14px;height:14px"></i>Label</label><input id="addr_label" value="${esc(a.label)}" placeholder="Home, Office, Jetty"/></div>
      <button class="btn btn-light btn-block" onclick="fetchCurrentLocation()"><i data-lucide="locate-fixed" style="width:16px;height:16px"></i><span>Fetch current location</span></button>
      <div class="field" style="margin-top:.85rem"><label><i data-lucide="map-pinned" style="width:14px;height:14px"></i>Address</label><input id="addr_line" value="${esc(a.line)}" placeholder="House / Street address"/></div>
      <div class="two">
        <div class="field"><label><i data-lucide="map" style="width:14px;height:14px"></i>City / Island</label><input id="addr_city" value="${esc(a.city)}" placeholder="City / Island"/></div>
        <div class="field"><label><i data-lucide="landmark" style="width:14px;height:14px"></i>Atoll</label><input id="addr_atoll" value="${esc(a.atoll)}" placeholder="Atoll"/></div>
      </div>
      <div class="two">
        <div class="field"><label><i data-lucide="mailbox" style="width:14px;height:14px"></i>Postcode</label><input id="addr_postcode" value="${esc(a.postcode)}" placeholder="Postcode"/></div>
        <div class="field"><label><i data-lucide="flag" style="width:14px;height:14px"></i>Country</label><input id="addr_country" value="${esc(a.country || 'Maldives')}" placeholder="Country"/></div>
      </div>
      <div class="field"><label><i data-lucide="truck" style="width:14px;height:14px"></i>Delivery type</label>
        <select id="addr_delivery_type" onchange="toggleBoatFields()">
          <option value="standard" ${a.deliveryType==='standard'?'selected':''}>Standard</option>
          <option value="speed_boat" ${a.deliveryType==='speed_boat'?'selected':''}>Speed Boat</option>
          <option value="boat" ${a.deliveryType==='boat'?'selected':''}>Boat</option>
        </select>
      </div>
      <div id="boatFields" style="${boatFieldsVisible(a.deliveryType)?'':'display:none'}">
        <div class="two">
          <div class="field"><label><i data-lucide="ship-wheel" style="width:14px;height:14px"></i>Boat name</label><input id="addr_boat_name" value="${esc(boat.boatName)}" placeholder="Boat name"/></div>
          <div class="field"><label><i data-lucide="phone" style="width:14px;height:14px"></i>Contact number</label><input id="addr_boat_contact" value="${esc(boat.contactNumber)}" placeholder="Contact number"/></div>
        </div>
        <div class="field"><label><i data-lucide="clock-3" style="width:14px;height:14px"></i>Departure time</label><input id="addr_boat_departure" value="${esc(boat.departureTime)}" placeholder="Dep time"/></div>
        <div class="field"><label><i data-lucide="notebook-pen" style="width:14px;height:14px"></i>Note</label><textarea id="addr_boat_note" placeholder="Pickup note, jetty note, driver note">${esc(boat.note)}</textarea></div>
      </div>
      <label class="switch-row"><input id="addr_default" type="checkbox" ${a.isDefault?'checked':''}/><span><b>Make default delivery address</b><div class="helper">This address and its delivery type will be used first at checkout.</div></span></label>
      <div class="actions" style="margin-top:1rem">
        <button class="btn btn-primary" onclick="saveAddress()"><i data-lucide="save" style="width:16px;height:16px"></i><span>Save address</span></button>
        <button class="btn btn-line" onclick="closeAddressEditor()"><i data-lucide="x" style="width:16px;height:16px"></i><span>Cancel</span></button>
      </div>
    </div>`;
  }
  function renderDetails(){
    $('#panel-details').innerHTML = `<div class="stack">
      ${detailsSummaryCard()}
      <div class="card">
        <div class="section-title">
          <div>
            <h2>Saved Addresses</h2>
            <div class="muted">Manage default delivery address and delivery type, including Speed Boat or Boat details.</div>
          </div>
          <button class="btn btn-primary" onclick="openAddressEditor()"><i data-lucide="plus" style="width:16px;height:16px"></i><span>Add</span></button>
        </div>
        <div class="stack">${(u.addresses||[]).length ? u.addresses.map(addressCard).join('') : '<div class="empty" style="padding:1rem 0;color:#6b7280">No saved addresses yet.</div>'}</div>
      </div>
      ${editingAddressId !== null ? addressEditor() : ''}
    </div>`;
    icons();
  }
  function openAddressEditor(id){
    editingAddressId = id || '';
    geoDraft = null;
    renderDetails();
  }
  function closeAddressEditor(){
    editingAddressId = null;
    geoDraft = null;
    renderDetails();
  }
  function toggleBoatFields(){
    const type = $('#addr_delivery_type').value;
    const box = $('#boatFields');
    if(box) box.style.display = boatFieldsVisible(type) ? '' : 'none';
  }
  async function fetchCurrentLocation(){
    if(!navigator.geolocation) return showToast('Geolocation not supported');
    showToast('Locating...');
    navigator.geolocation.getCurrentPosition(async pos=>{
      geoDraft = { lat:pos.coords.latitude, lng:pos.coords.longitude };
      try{
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${geoDraft.lat}&lon=${geoDraft.lng}&zoom=18&addressdetails=1`, { headers:{ Accept:'application/json' } });
        const d = await r.json();
        const a = d.address || {};
        $('#addr_line').value = [a.house_number, a.road || a.neighbourhood || a.suburb].filter(Boolean).join(' ') || d.display_name?.split(',').slice(0,2).join(', ') || $('#addr_line').value;
        $('#addr_city').value = a.city || a.town || a.village || a.county || $('#addr_city').value;
        $('#addr_atoll').value = a.state || a.region || $('#addr_atoll').value;
        $('#addr_postcode').value = a.postcode || $('#addr_postcode').value;
        $('#addr_country').value = a.country || $('#addr_country').value || 'Maldives';
        showToast('Address auto-filled from location');
      }catch(_){
        $('#addr_line').value = `Near ${geoDraft.lat.toFixed(4)}, ${geoDraft.lng.toFixed(4)}`;
        showToast('Coordinates saved');
      }
    }, ()=>showToast('Could not get location'), { enableHighAccuracy:true, timeout:10000 });
  }
  function saveUser(next){
    u = Store.upsert('users', next);
    Store.login(u);
    syncUser();
    renderHero();
    renderDetails();
  }
  function setDefaultAddress(id){
    const addresses = (u.addresses||[]).map(a=>({ ...a, isDefault:a.id===id }));
    saveUser({ ...u, addresses });
    showToast('Default delivery address updated');
  }
  function saveAddress(){
    const line = $('#addr_line').value.trim();
    if(!line) return showToast('Address is required');
    const addresses = (u.addresses||[]).map(a=>({ ...a }));
    const id = editingAddressId || Store.uid('a_');
    const isDefault = !!$('#addr_default').checked || !addresses.length;
    const deliveryType = $('#addr_delivery_type').value;
    const next = {
      id,
      label:$('#addr_label').value.trim() || 'Address',
      line,
      city:$('#addr_city').value.trim(),
      atoll:$('#addr_atoll').value.trim(),
      postcode:$('#addr_postcode').value.trim(),
      country:$('#addr_country').value.trim() || 'Maldives',
      lat:geoDraft ? geoDraft.lat : ((addresses.find(a=>a.id===id)||{}).lat || null),
      lng:geoDraft ? geoDraft.lng : ((addresses.find(a=>a.id===id)||{}).lng || null),
      isDefault,
      deliveryType,
      deliveryInfo:{
        boatName:$('#addr_boat_name') ? $('#addr_boat_name').value.trim() : '',
        contactNumber:$('#addr_boat_contact') ? $('#addr_boat_contact').value.trim() : '',
        departureTime:$('#addr_boat_departure') ? $('#addr_boat_departure').value.trim() : '',
        note:$('#addr_boat_note') ? $('#addr_boat_note').value.trim() : ''
      }
    };
    const idx = addresses.findIndex(a=>a.id===id);
    if(idx >= 0) addresses[idx] = next; else addresses.push(next);
    if(isDefault) addresses.forEach(a=>a.isDefault = a.id===id);
    if(addresses.length && !addresses.some(a=>a.isDefault)) addresses[0].isDefault = true;
    editingAddressId = null;
    geoDraft = null;
    saveUser({ ...u, addresses });
    showToast('Address saved');
  }
  function renderOrders(){
    const currentPhone = phoneKey(u.phone);
    const orders = Store.list('orders').filter(o=>phoneKey(o.userPhone)===currentPhone).slice().reverse();
    if(!orders.length){
      $('#panel-orders').innerHTML = `<div class="empty"><div style="font-size:2rem;margin-bottom:.5rem">📦</div>No orders yet.<br/><a href="index.html" style="color:#4f5cf0;font-weight:700">Start shopping</a></div>`;
      return;
    }
    $('#panel-orders').innerHTML = `<div class="stack">${orders.map(o=>{
      const total = o.items.reduce((s,i)=>s+i.price*i.qty,0)+(+o.shipping||0);
      const [bg,fg] = tone(o.status);
      return `<div class="order">
        <div class="order-top"><span class="order-id">#${o.id}</span><span class="pill" style="background:${bg};color:${fg}">${esc(o.status)}</span></div>
        ${o.items.map(it=>`<div class="order-item"><img src="${it.image||''}" alt=""/><div style="flex:1"><div class="nm">${esc(it.name)}</div><div class="mt">${MVR(it.price)} × ${it.qty}</div></div></div>`).join('')}
        <div class="order-foot"><span>${timeAgo(o.date)}</span><span>${MVR(total)}</span></div>
      </div>`;
    }).join('')}</div>`;
  }
  function timeAgo(ts){
    const d = Date.now() - ts, h = Math.floor(d / 3.6e6);
    if(h < 1) return Math.max(1, Math.floor(d / 6e4)) + 'm ago';
    if(h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }
  function renderOffers(){
    const offers = Store.offers(20);
    if(!offers.length){
      $('#panel-offers').innerHTML = `<div class="empty"><div style="font-size:2rem;margin-bottom:.5rem">🏷️</div>No offers right now.</div>`;
      return;
    }
    $('#panel-offers').innerHTML = `<div class="grid-2">${offers.map(p=>`
      <a href="post.html?id=${p.id}&cat=${p.cat}">
        <div class="pcard-img"><img src="${p.img}" alt="${esc(p.name)}"/></div>
        <div class="pcard-name">${esc(p.name)}</div>
        <div class="pcard-price">MVR ${(+p.price).toLocaleString()}</div>
      </a>
    `).join('')}</div>`;
  }
  function showTab(tab){
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===tab));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    $('#panel-' + tab).classList.add('active');
    history.replaceState(null,'','account.html?tab='+tab);
  }
  syncUser();
  renderHero();
  renderDetails();
  renderOrders();
  renderOffers();
  showTab((new URLSearchParams(location.search).get('tab') || 'details'));
  icons();
  window.addEventListener('kanxi:store-changed', ()=>{ syncUser(); renderHero(); renderDetails(); renderOrders(); renderOffers(); showTab((new URLSearchParams(location.search).get('tab') || 'details')); });
  if(location.protocol !== 'file:'){
    Store.syncFromCloud().finally(()=>{
      syncUser();
      renderHero();
      renderDetails();
      renderOrders();
      renderOffers();
      showTab((new URLSearchParams(location.search).get('tab') || 'details'));
    });
  }
</script>
</body>
</html>
