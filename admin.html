<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kanxi Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { kink:'#1a1814', kacc:'#b89b7a', kcream:'#f5ede0', kgray:'#6e6860' },
        fontFamily: { serif:['Playfair Display','serif'], sans:['Inter','sans-serif'] }
      }}
    }
  </script>
  <style>
    body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:4px;}
    [x-cloak]{display:none;}
  </style>
</head>
<body class="bg-zinc-100 text-kink">

<div class="flex min-h-screen">

  <!-- ── SIDEBAR ── -->
  <aside id="sidebar" class="fixed lg:static z-40 inset-y-0 left-0 w-64 bg-kink text-zinc-300 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="flex items-center gap-3 px-5 py-4 border-b border-white/10">
      <svg viewBox="415 270 325 375" class="h-10" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,1254) scale(0.1,-0.1)" stroke="none"><path fill="#fff" d="M4477 9643 c-17 -16 -1 -20 91 -26 183 -11 246 -49 285 -171 l22 -71 0 -1290 c0 -1377 1 -1360 -48 -1448 -23 -42 -81 -80 -137 -93 -19 -4 -75 -10 -124 -13 -58 -4 -91 -10 -94 -18 -3 -10 109 -13 537 -13 307 0 542 4 545 9 8 13 -19 21 -73 21 -73 0 -151 27 -186 65 -17 18 -40 57 -51 86 -18 52 -19 95 -22 1334 -2 856 1 1306 8 1360 6 46 21 102 36 132 21 44 34 56 80 79 37 18 78 28 129 33 42 3 76 11 78 16 2 11 -1065 20 -1076 8z"/><g transform="translate(6350,7900) scale(0.78) translate(-6350,-7900)"><path fill="#b89b7a" d="M6540 9635 c0 -11 11 -15 38 -15 47 0 103 -28 121 -61 21 -38 7 -89 -43 -156 -59 -79 -554 -594 -1010 -1050 l-371 -373 81 0 81 0 234 -246 c129 -135 234 -249 234 -252 0 -4 -26 -59 -57 -122 -170 -343 -170 -724 -1 -1065 61 -123 121 -204 227 -310 175 -174 377 -281 656 -346 121 -29 425 -37 568 -15 264 40 518 170 666 340 55 63 106 135 106 148 0 20 -27 5 -49 -27 -33 -49 -157 -165 -227 -212 -266 -181 -601 -236 -926 -154 -385 97 -665 363 -807 765 -78 220 -90 520 -31 752 11 42 22 79 23 81 6 6 225 -220 714 -739 l73 -78 325 0 c196 0 325 4 325 9 0 6 -21 12 -47 16 -139 17 -227 50 -322 119 -60 45 -558 558 -885 913 l-49 53 29 42 c47 70 164 181 249 236 269 176 642 210 967 88 253 -95 464 -300 514 -498 9 -38 21 -68 26 -68 10 0 6 176 -8 362 l-6 77 -47 30 c-169 108 -391 183 -624 212 -123 15 -406 6 -502 -15 -251 -56 -463 -165 -644 -331 l-44 -40 -76 82 c-42 45 -146 157 -231 248 -85 91 -156 172 -158 178 -1 7 271 285 605 618 465 464 626 619 687 659 125 84 213 117 339 129 37 3 69 11 70 16 1 7 -137 11 -395 13 -350 2 -398 0 -398 -13z"/></g></g></svg>
      <div>
        <div class="font-serif font-bold tracking-[0.2em] uppercase text-sm text-white">Kanxi</div>
        <div class="text-[0.6rem] tracking-[0.25em] uppercase text-kacc">Admin</div>
      </div>
    </div>
    <nav class="flex-1 overflow-y-auto py-2" id="nav">
      <p class="px-5 pt-3 pb-1 text-[0.65rem] tracking-widest uppercase text-zinc-500 font-semibold">Overview</p>
      <button data-route="dashboard" class="navi"><i data-lucide="layout-dashboard" class="w-[18px] h-[18px]"></i> Dashboard</button>
      <button data-route="homepage" class="navi"><i data-lucide="layout-template" class="w-[18px] h-[18px]"></i> Homepage CMS</button>
      <p class="px-5 pt-4 pb-1 text-[0.65rem] tracking-widest uppercase text-zinc-500 font-semibold">Catalog</p>
      <button data-route="categories" class="navi"><i data-lucide="layout-grid" class="w-[18px] h-[18px]"></i> Categories</button>
      <button data-route="subcategories" class="navi"><i data-lucide="list-tree" class="w-[18px] h-[18px]"></i> Sub-categories</button>
      <button data-route="products" class="navi"><i data-lucide="shirt" class="w-[18px] h-[18px]"></i> Products</button>
      <button data-route="tags" class="navi"><i data-lucide="tag" class="w-[18px] h-[18px]"></i> Tags</button>
      <button data-route="inventory" class="navi"><i data-lucide="boxes" class="w-[18px] h-[18px]"></i> Inventory</button>
      <p class="px-5 pt-4 pb-1 text-[0.65rem] tracking-widest uppercase text-zinc-500 font-semibold">Sales</p>
      <button data-route="orders" class="navi"><i data-lucide="package" class="w-[18px] h-[18px]"></i> Orders <span id="ordBadge" class="ml-auto hidden bg-kacc text-white text-[0.6rem] font-bold rounded-full px-2 py-0.5"></span></button>
      <button data-route="payments" class="navi"><i data-lucide="credit-card" class="w-[18px] h-[18px]"></i> Payments</button>
      <p class="px-5 pt-4 pb-1 text-[0.65rem] tracking-widest uppercase text-zinc-500 font-semibold">People</p>
      <button data-route="users" class="navi"><i data-lucide="users" class="w-[18px] h-[18px]"></i> Users</button>
      <p class="px-5 pt-4 pb-1 text-[0.65rem] tracking-widest uppercase text-zinc-500 font-semibold">System</p>
      <button onclick="if(confirm('Reset all demo data?')){Store.reset();location.reload();}" class="navi"><i data-lucide="rotate-ccw" class="w-[18px] h-[18px]"></i> Reset data</button>
    </nav>
  </aside>
  <div id="scrim" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/40 z-30 lg:hidden"></div>

  <!-- ── MAIN ── -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 bg-white border-b border-zinc-200 px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="lg:hidden text-2xl">☰</button>
        <h1 id="pageTitle" class="text-lg font-extrabold">Dashboard</h1>
      </div>
      <div class="flex items-center gap-4">
        <a href="index.html" target="_blank" class="text-sm font-semibold text-blue-600 hover:underline">View store ↗</a>
        <div class="flex items-center gap-2 text-sm font-semibold">
          <span class="w-8 h-8 rounded-full bg-kacc text-white grid place-items-center font-bold">K</span>
          <span class="hidden sm:inline">Admin</span>
        </div>
      </div>
    </header>
    <main id="content" class="p-4 sm:p-6 flex-1"></main>
  </div>
</div>

<!-- ── MODAL ── -->
<div id="modalBg" class="hidden fixed inset-0 bg-black/50 z-50 items-start justify-center p-4 sm:py-12 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-xl shadow-2xl">
    <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-200">
      <h3 id="modalTitle" class="text-base font-extrabold">Edit</h3>
      <button onclick="closeModal()" class="text-2xl text-zinc-400 hover:text-kink leading-none">&times;</button>
    </div>
    <div id="modalBody" class="px-5 py-5 max-h-[65vh] overflow-y-auto"></div>
    <div id="modalFoot" class="flex gap-2 justify-end px-5 py-4 border-t border-zinc-200"></div>
  </div>
</div>

<style>
  .navi{display:flex;align-items:center;gap:0.65rem;width:100%;text-align:left;padding:0.6rem 1.25rem;font-size:0.875rem;font-weight:500;color:#d4d4d8;border-left:3px solid transparent;transition:.15s;}
  .navi:hover{background:#252118;color:#fff;}
  .navi.active{background:#252118;color:#fff;border-left-color:#b89b7a;}
  .tagchip.on{background:#1a1814;color:#fff;border-color:#1a1814;}
</style>

<!-- ── QR SCAN OVERLAY ── -->
<div id="scanOverlay" class="hidden fixed inset-0 bg-black/80 z-[60] flex-col items-center justify-center p-4">
  <p class="text-white font-semibold mb-3">Point camera at the variant QR / barcode</p>
  <div id="qr-reader" class="w-full max-w-sm rounded-xl overflow-hidden bg-black"></div>
  <button onclick="stopScan()" class="mt-4 px-5 py-2.5 rounded-lg bg-white text-kink font-semibold">Cancel</button>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=1"></script>
<script src="assets/store.js?v=4"></script>
<script>
  /* ── Lucide auto-render: re-create icons whenever content/modal changes ── */
  let _iconRAF;
  function icons(){ if(!window.lucide) return; cancelAnimationFrame(_iconRAF); _iconRAF = requestAnimationFrame(()=>lucide.createIcons()); }
  ['content','modalBody','modalFoot','nav'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) new MutationObserver(()=>icons()).observe(el,{childList:true,subtree:true});
  });
  /* helper to emit a lucide icon string */
  const ic = (name, cls='w-4 h-4') => `<i data-lucide="${name}" class="${cls} pointer-events-none"></i>`;

  const $ = s => document.querySelector(s);
  const content = $('#content');
  const MVR = n => 'MVR ' + (+n).toLocaleString();
  const esc = s => (s==null?'':String(s)).replace(/"/g,'&quot;');

  function toggleSidebar(){ $('#sidebar').classList.toggle('-translate-x-full'); $('#scrim').classList.toggle('hidden'); }

  /* ── MODAL ── */
  function openModal(title, body, foot){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=body; $('#modalFoot').innerHTML=foot||''; const m=$('#modalBg'); m.classList.add('flex'); m.classList.remove('hidden'); m.scrollTop=0; }
  function closeModal(){ const m=$('#modalBg'); m.classList.add('hidden'); m.classList.remove('flex'); }
  $('#modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

  /* ── admin toast ── */
  function toast(msg){ let t=document.getElementById('atoast'); if(!t){ t=document.createElement('div'); t.id='atoast'; t.className='fixed bottom-5 left-1/2 -translate-x-1/2 bg-kink text-white px-4 py-2.5 rounded-lg text-sm z-[70] shadow-lg transition-all'; t.style.opacity='0'; document.body.appendChild(t);} t.textContent=msg; t.style.opacity='1'; clearTimeout(window._tt); window._tt=setTimeout(()=>t.style.opacity='0',2400); }

  /* ── QR image (display) ── */
  const qrImg = (data,size=140)=>`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=6&data=${encodeURIComponent(data)}`;

  /* ── QR scanner (camera) ── */
  let _scanTarget=null;
  function startScan(cb){
    if(typeof Html5Qrcode==='undefined'){ toast('Scanner library not loaded'); return; }
    _scanTarget=cb||null;
    document.getElementById('scanOverlay').classList.remove('hidden');
    document.getElementById('scanOverlay').classList.add('flex');
    window._qr=new Html5Qrcode('qr-reader');
    window._qr.start({facingMode:'environment'},{fps:10,qrbox:220},(text)=>{ const t=text; stopScan(); if(_scanTarget)_scanTarget(t); }, ()=>{})
      .catch(e=>{ toast('Camera unavailable — type SKU manually'); stopScan(); });
  }
  function stopScan(){ const o=document.getElementById('scanOverlay'); if(window._qr){ window._qr.stop().then(()=>window._qr.clear()).catch(()=>{}); window._qr=null; } o.classList.add('hidden'); o.classList.remove('flex'); }

  /* ── view/print variant QR codes for a product ── */
  function viewQRCodes(pid){
    const p=Store.get('products',pid); if(!p) return;
    const vs=(p.variants||[]);
    const cells = (vs.length?vs:[null]).map(v=>{ const sku=Store.skuOfVariant(p,v); const label=v?`${Store.variantTypeLabel(p.variantType)}: ${v.value}`:'Single product';
      return `<div class="text-center border border-zinc-200 rounded-xl p-3"><img src="${qrImg(sku,150)}" class="w-32 h-32 mx-auto"/><div class="font-semibold text-sm mt-2">${label}</div><div class="font-mono text-xs text-zinc-500">${sku}</div></div>`; }).join('');
    openModal('QR Codes — '+p.name,
      `<div id="qrPrint" class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cells}</div>`,
      `<button onclick="closeModal()" class="${btn.light}">Close</button><button onclick="printQRs()" class="${btn.primary}">${ic('printer','w-4 h-4')} Print</button>`);
  }
  function printQRs(){ const html=document.getElementById('qrPrint').innerHTML; const w=window.open('','_print','width=800,height=900');
    w.document.write('<html><head><title>Kanxi SKU QR Codes</title><style>body{font-family:Inter,sans-serif;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid>div{text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px}img{width:130px;height:130px}.font-mono{font-family:monospace;font-size:11px;color:#666}.font-semibold{font-weight:600;font-size:13px;margin-top:6px}</style></head><body><div class="grid">'+html+'</div><script>onload=()=>{print();setTimeout(()=>close(),300)}<\/script></body></html>'); w.document.close(); }

  /* ── shared UI bits ── */
  const F = {
    input:(id,val,ph='',type='text')=>`<input id="${id}" type="${type}" value="${esc(val)}" placeholder="${ph}" class="w-full px-3 py-2.5 border border-zinc-300 rounded-lg text-sm outline-none focus:border-kink"/>`,
    label:t=>`<label class="block text-xs font-bold tracking-wide uppercase text-kgray mb-1.5">${t}</label>`,
    fg:(label,inner)=>`<div class="mb-4">${F.label(label)}${inner}</div>`,
  };
  const btn = { primary:'inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold bg-kink text-white hover:bg-kacc transition',
                light:'inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold bg-zinc-100 text-kink border border-zinc-200 hover:bg-zinc-200 transition',
                sm:'!px-3 !py-1.5 text-xs', danger:'!bg-red-50 text-red-600 hover:!bg-red-600 hover:text-white transition' };

  function pill(text, tone='gray'){
    const map={gray:'bg-zinc-100 text-zinc-600',green:'bg-green-50 text-green-700',red:'bg-red-50 text-red-600',amber:'bg-amber-50 text-amber-700',blue:'bg-blue-50 text-blue-700',purple:'bg-purple-50 text-purple-700',dark:'bg-kink text-white'};
    return `<span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-full whitespace-nowrap ${map[tone]}">${text}</span>`;
  }
  function statusPill(s){ const m={'Pending Payment':'amber','Paid':'blue','Order Accepted':'blue','Packing':'purple','Ready to Dispatch':'purple','Out for Delivery':'blue','Delivered':'green','Returned':'red'}; return pill(s,m[s]||'gray'); }
  function payPill(s){ const m={Paid:'green',Pending:'amber',Refunded:'red'}; return pill(s,m[s]||'gray'); }
  function card(title, tools, inner){
    return `<div class="bg-white border border-zinc-200 rounded-2xl overflow-hidden">
      <div class="flex items-center justify-between gap-3 px-5 py-3.5 border-b border-zinc-200 flex-wrap">
        <h2 class="font-extrabold">${title}</h2><div class="flex gap-2 items-center flex-wrap">${tools||''}</div></div>
      <div class="overflow-x-auto">${inner}</div></div>`;
  }
  const TH = cols => `<thead><tr class="bg-zinc-50">${cols.map(c=>`<th class="text-left text-[0.68rem] tracking-wide uppercase text-zinc-500 font-bold px-5 py-2.5 border-b border-zinc-200 whitespace-nowrap">${c}</th>`).join('')}</tr></thead>`;
  const empty = c => `<tr><td colspan="${c}" class="text-center text-zinc-400 py-12"><div class="text-4xl mb-2">📭</div>Nothing here yet.</td></tr>`;
  const td = (inner,cls='')=>`<td class="px-5 py-3 border-b border-zinc-100 text-sm align-middle ${cls}">${inner}</td>`;
  function del(coll,id,after){ if(confirm('Delete this item?')){ Store.remove(coll,id); after(); } }
  function timeAgo(ts){ const d=Date.now()-ts,h=Math.floor(d/3.6e6); if(h<1)return Math.max(1,Math.floor(d/6e4))+'m ago'; if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago'; }
  const actBtns = (onEdit,onDel)=>`<div class="flex gap-1">
    <button type="button" aria-label="Edit" title="Edit" onclick="event.stopPropagation(); ${onEdit}" class="inline-flex h-9 w-9 items-center justify-center rounded text-zinc-500 hover:bg-zinc-100 hover:text-kink">${ic('square-pen','w-4 h-4')}</button>
    <button type="button" aria-label="Delete" title="Delete" onclick="event.stopPropagation(); ${onDel}" class="inline-flex h-9 w-9 items-center justify-center rounded text-zinc-500 hover:bg-red-50 hover:text-red-600">${ic('trash-2','w-4 h-4')}</button></div>`;

  /* ── ROUTING ── */
  const routes = { dashboard:dashboard, homepage:homepage, categories:categories, subcategories:subcats, products:products, tags:tags, inventory:inventory, orders:orders, payments:payments, users:users };
  const titles = { dashboard:'Dashboard', homepage:'Homepage CMS', categories:'Categories', subcategories:'Sub-categories', products:'Products', tags:'Tags', inventory:'Inventory', orders:'Orders', payments:'Payments', users:'Users' };
  function go(route){
    if(!routes[route]) route='dashboard';
    location.hash = route;
    document.querySelectorAll('.navi[data-route]').forEach(n=>n.classList.toggle('active', n.dataset.route===route));
    $('#pageTitle').textContent = titles[route];
    routes[route]();
    $('#sidebar').classList.add('-translate-x-full'); $('#sidebar').classList.remove('lg:-translate-x-full'); $('#scrim').classList.add('hidden');
    window.scrollTo(0,0);
  }
  document.querySelectorAll('.navi[data-route]').forEach(n=>n.addEventListener('click',()=>go(n.dataset.route)));
  function refreshBadge(){ const p=Store.list('orders').filter(o=>!['Delivered','Returned'].includes(o.status)).length; const b=$('#ordBadge'); b.textContent=p||''; b.classList.toggle('hidden',!p); }

  /* ════════ HOMEPAGE CMS ════════ */
  var _hp=null;
  const titleInput=(path,val)=>`<input value="${esc(val)}" oninput="${path}=this.value" placeholder="Section title" class="px-3 py-1.5 border border-zinc-300 rounded-lg text-sm font-semibold outline-none focus:border-kink min-w-[200px]"/>`;
  function homepage(){ _hp=JSON.parse(JSON.stringify(Store.getHomepage())); renderHP(); }
  function renderHP(){
    const brands=Store.allBrands();
    const brandsById={}; brands.forEach(b=>brandsById[b.id]=b);
    const selectedBrands = `${_hp.brands.brandIds.length?`<div class="px-4 pt-4"><p class="text-xs text-zinc-400 mb-2">Featured order — drag to reorder</p><div class="flex flex-wrap gap-2">${_hp.brands.brandIds.map((bid,i)=>{ const b=brandsById[bid]; if(!b)return ''; return `<div draggable="true" ondragstart="dragStart(event,'brand',${i})" ondragover="dragOver(event)" ondrop="dropAt(event,'brand',${i})" class="flex items-center gap-1.5 border border-kacc bg-kcream/40 rounded-full pl-1.5 pr-2 py-1 cursor-grab active:cursor-grabbing">${ic('grip-vertical','w-3.5 h-3.5 text-zinc-400 pointer-events-none')}${b.logo?`<img src="${b.logo}" class="w-5 h-5 rounded-full object-contain pointer-events-none"/>`:''}<span class="text-xs font-semibold pointer-events-none">${b.name}</span><button onclick="toggleBrand('${bid}')" class="text-zinc-400 hover:text-red-600">${ic('x','w-3 h-3')}</button></div>`; }).join('')}</div></div>`:''}`;
    content.innerHTML =
      `<div class="flex items-center justify-between mb-4"><p class="text-sm text-zinc-500">Edit the storefront homepage. Changes appear after customers reload.</p>
        <button onclick="saveHP()" class="${btn.primary}">${ic('save','w-4 h-4')} Save Homepage</button></div>`+
      /* Collections */
      card(`Section 1`, titleInput('_hp.collections.title',_hp.collections.title),
        `<div class="p-4 grid grid-cols-2 sm:grid-cols-4 gap-3" id="ccGrid">${_hp.collections.cards.map(ccCard).join('')}</div>
         <div class="px-4 pb-4"><button onclick="addCC()" class="${btn.light} ${btn.sm}">${ic('plus','w-4 h-4')} Add card</button></div>`)+
      `<div class="h-4"></div>`+
      /* Brands */
      card(`Section 2`, titleInput('_hp.brands.title',_hp.brands.title),
        brands.length? selectedBrands + `<div class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-2">${brands.map(b=>`
          <label class="flex items-center gap-2 border rounded-lg p-2 cursor-pointer ${_hp.brands.brandIds.includes(b.id)?'border-kacc ring-1 ring-kacc bg-kcream/40':'border-zinc-200'}">
            <input type="checkbox" ${_hp.brands.brandIds.includes(b.id)?'checked':''} onchange="toggleBrand('${b.id}')" class="accent-kink"/>
            ${b.logo?`<img src="${b.logo}" class="w-8 h-8 object-contain rounded"/>`:`<span class="w-8 h-8 rounded-full bg-kcream text-kacc grid place-items-center text-[0.62rem] font-bold">${(b.name||'?').slice(0,2).toUpperCase()}</span>`}
            <span class="text-sm font-medium">${b.name}</span><span class="text-[0.7rem] text-zinc-400 ml-auto">${b.subName}</span></label>`).join('')}</div>`
          :`<p class="p-5 text-sm text-zinc-400">No brands yet — add brands in <b>Sub-categories</b> first.</p>`)+
      `<div class="h-4"></div>`+
      /* Best Sellers */
      card(`Section 3`, titleInput('_hp.bestsellers.title',_hp.bestsellers.title)+`<span class="text-xs text-zinc-400 ml-2">Top <input type="number" min="2" value="${_hp.bestsellers.limit||8}" onchange="_hp.bestsellers.limit=+this.value||8;renderHP()" class="w-14 px-2 py-1 border border-zinc-300 rounded text-xs"/> by sales</span>`,
        autoPreview(Store.bestSellers(_hp.bestsellers.limit||8),true))+
      `<div class="h-4"></div>`+
      /* Offers */
      card(`Section 4`, titleInput('_hp.offers.title',_hp.offers.title)+`<span class="text-xs text-zinc-400 ml-2">Show <input type="number" min="2" value="${_hp.offers.limit||12}" onchange="_hp.offers.limit=+this.value||12;renderHP()" class="w-14 px-2 py-1 border border-zinc-300 rounded text-xs"/></span>`,
        autoPreview(Store.offers(_hp.offers.limit||12),false));
  }
  function ccCard(c,i){ const img=c.image||Store.imageForTag(c.tagId)||'';
    return `<div class="border border-zinc-200 rounded-xl overflow-hidden" ondragover="dragOver(event)" ondrop="dropAt(event,'cc',${i})">
      <div class="relative bg-zinc-100 overflow-hidden" style="width:100%;padding-top:110%">${img?`<img src="${img}" class="pointer-events-none" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center"/>`:`<div class="absolute inset-0 grid place-items-center text-zinc-300">${ic('image','w-8 h-8')}</div>`}

  var _dragFrom=null;
  function dragStart(e,kind,i){ _dragFrom={kind,i:+i}; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(i));}catch(_){} }
  function dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; }
  function dropAt(e,kind,i){ e.preventDefault(); if(!_dragFrom||_dragFrom.kind!==kind){ _dragFrom=null; return; }
    const from=_dragFrom.i, to=+i; _dragFrom=null; if(from===to) return;
    const a = kind==='cc' ? _hp.collections.cards : _hp.brands.brandIds;
    const [m]=a.splice(from,1); a.splice(to,0,m); renderHP();
  }
  /* crop-resize an image to a target aspect (cover) so it fits the homepage card exactly */
  function cropCover(src, outW, aspect, q, cb){
    const img=new Image();
    img.onload=()=>{ const outH=Math.round(outW/aspect);
      const c=document.createElement('canvas'); c.width=outW; c.height=outH; const ctx=c.getContext('2d');
      const scale=Math.max(outW/img.width, outH/img.height); const dw=img.width*scale, dh=img.height*scale;
      ctx.drawImage(img, (outW-dw)/2, (outH-dh)/2, dw, dh);
      try{ cb(c.toDataURL('image/jpeg',q)); }catch(e){ cb(src); } };
    img.onerror=()=>cb(src); img.src=src;
  }
  const CC_ASPECT = 4/4.4; // homepage collection-card aspect
  function onCCImage(i,input){ const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=e=>cropCover(e.target.result,560,CC_ASPECT,0.75,d=>{ _hp.collections.cards[i].image=d; renderHP(); }); r.readAsDataURL(f); input.value=''; }

      `<div class="mb-2" id="optWrap">${lbl('list-checks','Variant Options')}

        <p class="text-[0.72rem] text-zinc-400 mt-1.5">Each option has a unique <b>SKU</b> (scan its QR in Inventory). Stock, cost &amp; selling price are set per option in <b>Inventory → Batches</b>.</p></div>`,

  /* ── IMAGE UPLOAD (multiple) ── */
  function renderImgs(){
    const wrap=document.getElementById('imgList'); if(!wrap) return;
    wrap.innerHTML=_imgs.map((src,i)=>`<div class="relative">
      <img src="${src}" class="w-20 h-20 object-cover rounded-lg border border-zinc-200"/>
      ${i===0?'<span class="absolute bottom-0 inset-x-0 bg-kink/80 text-white text-[0.55rem] text-center py-0.5 rounded-b-lg">Primary</span>':''}
      <button type="button" onclick="delImg(${i})" class="absolute -top-2 -right-2 w-5 h-5 bg-white border border-zinc-300 rounded-full grid place-items-center text-zinc-500 hover:text-red-600 shadow-sm">${ic('x','w-3 h-3')}</button>
    </div>`).join('') || '<p class="text-xs text-zinc-400">No images yet — upload or add a URL.</p>';
  }
  function delImg(i){ _imgs.splice(i,1); renderImgs(); }
  function addImgUrl(){ const el=document.getElementById('p_imgurl'); const v=el.value.trim(); if(v){ _imgs.push(v); el.value=''; renderImgs(); } }
  function onImgFiles(input){
    [...input.files].forEach(file=>{ const r=new FileReader(); r.onload=e=>compressImage(e.target.result,700,0.72,d=>{ _imgs.push(d); renderImgs(); }); r.readAsDataURL(file); });
    input.value='';
  }
  function compressImage(src,maxW,q,cb){
    const img=new Image();
    img.onload=()=>{ const sc=Math.min(1,maxW/img.width), w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL('image/jpeg',q)); }catch(e){ cb(src); } };
    img.onerror=()=>cb(src); img.src=src;
  }

  function reloadSubs(sel){ const cat=$('#p_cat').value, subs=Store.list('subcategories').filter(s=>s.categoryId===cat);
    $('#p_sub').innerHTML=`<option value="">—</option>`+subs.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${s.name}</option>`).join(''); }
  function onCatChange(){ reloadSubs(); const c=Store.get('categories',$('#p_cat').value); _vtype=(c&&c.variantType)||'none'; const sel=$('#p_vtype'); if(sel)sel.value=_vtype; renderVars(); }
  function setVType(v){ _vtype=v; if(v!=='shade')_vars.forEach(x=>x.color=null); renderVars(); }
  function renderVars(){
    const wrap=$('#varList'), optWrap=$('#optWrap'); if(!wrap) return;
    if(_vtype==='none'){ if(optWrap)optWrap.style.display='none'; wrap.innerHTML=''; return; }
    if(optWrap) optWrap.style.display='';
    const inp='px-2 py-1.5 border border-zinc-300 rounded text-xs w-full outline-none focus:border-kink';
    const ph=_vtype==='size'?'M':_vtype==='volume'?'50ml':'Rose';
    wrap.innerHTML=_vars.map((v,i)=>`<div class="flex gap-1.5 mb-1.5 items-center">
      <input value="${esc(v.value)}" oninput="_vars[${i}].value=this.value" placeholder="${ph}" class="${inp}" style="max-width:120px"/>
      ${_vtype==='shade'?`<input type="color" value="${v.color||'#cccccc'}" oninput="_vars[${i}].color=this.value" class="w-9 h-8 rounded border border-zinc-300 cursor-pointer p-0.5"/>`:''}
      <span class="flex-1 font-mono text-[0.62rem] text-zinc-400 truncate">${v.sku||'SKU on save'}</span>
      <button type="button" onclick="_vars.splice(${i},1);renderVars()" class="text-zinc-400 hover:text-red-600 grid place-items-center w-7">${ic('trash-2','w-4 h-4')}</button></div>`).join('')
      || '<p class="text-xs text-zinc-400 py-1">No options yet — click "Add option".</p>'; }
  function addVar(){ _vars.push({id:Store.uid('v_'),value:'',color:_vtype==='shade'?'#cccccc':null}); renderVars(); }
  function saveProduct(id){
    const name=$('#p_name').value.trim(); if(!name){ alert('Product name is required'); return; }
    const pid = id || Store.uid('p_');
    const tg=[...document.querySelectorAll('#p_tags .tagchip.on')].map(c=>c.dataset.id);
    const opts = _vtype==='none' ? [] : _vars.filter(v=>(v.value||'').trim()).map(v=>{
      const val=v.value.trim();
      return { id:v.id||Store.uid('v_'), value:val, color:_vtype==='shade'?(v.color||'#cccccc'):null, sku:Store.skuFor(pid,{value:val}) };
    });
    const primary = _imgs[0] || 'https://images.unsplash.com/photo-1594938298603-c8148c4b4e7b?w=600&q=80';
    try {
      Store.upsert('products',{
        id:pid, name,
        brand:$('#p_brand').value.trim()||'Kanxi Collection',
        image:primary, images:_imgs.slice(),
        categoryId:$('#p_cat').value, subId:$('#p_sub').value,
        price:+$('#p_price').value||0, oldPrice:+$('#p_old').value||null,
        status:$('#p_status').value, tags:tg, variantType:_vtype, variants:opts
      });
    } catch(e){ alert('Could not save — storage is full. Try fewer/smaller uploaded images.'); return; }
    closeModal(); products(); toast('Product saved');
  }

  /* ════════ INVENTORY (BATCHES) ════════ */
  function inventory(){
    const bs=Store.list('batches').slice().reverse();
    const totalUnits=bs.reduce((s,b)=>s+(+b.stock||0),0);
    const stockValue=bs.reduce((s,b)=>s+(+b.stock||0)*(+b.costPrice||0),0);
    content.innerHTML =
      `<div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-5">
        <div class="bg-white border border-zinc-200 rounded-2xl p-5"><div class="flex justify-between"><span class="text-xs uppercase tracking-wide text-zinc-400 font-semibold">Batches</span><span class="w-9 h-9 rounded-xl bg-kcream text-kacc grid place-items-center">${ic('boxes','w-5 h-5')}</span></div><div class="text-2xl font-extrabold mt-2">${bs.length}</div></div>
        <div class="bg-white border border-zinc-200 rounded-2xl p-5"><div class="flex justify-between"><span class="text-xs uppercase tracking-wide text-zinc-400 font-semibold">Units in stock</span><span class="w-9 h-9 rounded-xl bg-kcream text-kacc grid place-items-center">${ic('layers','w-5 h-5')}</span></div><div class="text-2xl font-extrabold mt-2">${totalUnits}</div></div>
        <div class="bg-white border border-zinc-200 rounded-2xl p-5"><div class="flex justify-between"><span class="text-xs uppercase tracking-wide text-zinc-400 font-semibold">Stock value (cost)</span><span class="w-9 h-9 rounded-xl bg-kcream text-kacc grid place-items-center">${ic('coins','w-5 h-5')}</span></div><div class="text-2xl font-extrabold mt-2">${MVR(stockValue)}</div></div>
      </div>`+
      card('Inventory — Product Batches',
      `<button onclick="editBatch()" class="${btn.primary} ${btn.sm}">${ic('plus','w-4 h-4')} Add Batch</button>`,
      `<table class="w-full">${TH(['Product','Variant','Batch','Cost','Selling','Margin','Stock','Expiry',''])}<tbody>
      ${bs.map(brow).join('')||empty(9)}</tbody></table>`);
  }
  function brow(b){
    const p=Store.get('products',b.productId)||{name:'(deleted)',image:'',variants:[]};
    const v=(p.variants||[]).find(x=>x.id===b.variantId);
    const m=b.sellingPrice?Math.round((1-b.costPrice/b.sellingPrice)*100):0;
    const vlabel = v ? (v.color?`<span class="inline-block w-2.5 h-2.5 rounded-full mr-1 align-middle" style="background:${v.color}"></span>`:'')+v.value : '<span class="text-zinc-300">—</span>';
    return `<tr class="hover:bg-zinc-50">
      ${td(`<div class="flex items-center gap-2"><img src="${p.image}" class="w-8 h-8 rounded object-cover bg-zinc-100"/><b class="text-sm">${p.name}</b></div>`)}
      ${td(vlabel)}
      ${td(b.batchNo,'font-mono text-xs')}
      ${td(MVR(b.costPrice))}${td('<b>'+MVR(b.sellingPrice)+'</b>')}
      ${td(pill(m+'%', m>=40?'green':m>=20?'amber':'red'))}
      ${td(pill(b.stock+' u', b.stock<6?'amber':'green'))}
      ${td(b.expiry||'<span class="text-zinc-300">—</span>','text-xs')}
      ${td(actBtns(`editBatch('${b.id}')`,`del('batches','${b.id}',inventory)`))}</tr>`;
  }
  function nextBatchNo(){ const nums=Store.list('batches').map(b=>parseInt(String(b.batchNo||'').replace(/\D/g,''))||0); return 'B-'+String((nums.length?Math.max(...nums):0)+1).padStart(4,'0'); }
  function editBatch(id){
    const b=id?Store.get('batches',id):{productId:(Store.list('products')[0]||{}).id,variantId:null,batchNo:nextBatchNo(),costPrice:'',sellingPrice:'',stock:'',expiry:''};
    const prods=Store.list('products'); const sel='w-full px-3 py-2.5 border border-zinc-300 rounded-lg text-sm';
    openModal(id?'Edit Batch':'Add Batch',
      F.fg('Scan / SKU',`<div class="flex gap-2">
        <input id="b_sku" placeholder="Scan QR or type SKU…" class="flex-1 px-3 py-2.5 border border-zinc-300 rounded-lg text-sm font-mono outline-none focus:border-kink"/>
        <button type="button" onclick="startScan(onBatchScan)" class="${btn.primary} ${btn.sm} shrink-0">${ic('scan-line','w-4 h-4')} Scan</button>
        <button type="button" onclick="resolveBatchSku(document.getElementById('b_sku').value)" class="${btn.light} ${btn.sm} shrink-0">Find</button></div>`)+
      F.fg('Product',`<select id="b_prod" onchange="loadBatchVariants()" class="${sel}">${prods.map(p=>`<option value="${p.id}" ${p.id===b.productId?'selected':''}>${p.name}</option>`).join('')}</select>`)+
      F.fg('Variant / Option',`<select id="b_var" onchange="syncBatchSku()" class="${sel}"></select>`)+
      `<div class="flex gap-3"><div class="flex-1">${F.fg('Batch No (auto)',`<input id="b_no" value="${esc(b.batchNo||nextBatchNo())}" readonly class="w-full px-3 py-2.5 border border-zinc-200 rounded-lg text-sm bg-zinc-100 text-zinc-500 font-mono"/>`)}</div><div class="flex-1">${F.fg('Stock (units)',F.input('b_stock',b.stock,'','number'))}</div></div>`+
      `<div class="flex gap-3"><div class="flex-1">${F.fg('Cost Price (MVR)',F.input('b_cost',b.costPrice,'','number'))}</div><div class="flex-1">${F.fg('Selling Price (MVR)',F.input('b_sell',b.sellingPrice,'','number'))}</div></div>`+
      `<div id="marginHint" class="text-xs text-zinc-500 mb-3"></div>`+
      F.fg('Expiry date (optional)',F.input('b_exp',b.expiry,'','date')),
      `<button onclick="closeModal()" class="${btn.light}">Cancel</button><button onclick="saveBatch('${id||''}')" class="${btn.primary}">${ic('save','w-4 h-4')} Save Batch</button>`);
    loadBatchVariants(b.variantId);
    ['b_cost','b_sell'].forEach(x=>$('#'+x).addEventListener('input',marginHint)); marginHint();
  }
  function marginHint(){ const c=+$('#b_cost').value||0, s=+$('#b_sell').value||0; const el=$('#marginHint'); if(!el)return;
    if(c&&s){ const m=Math.round((1-c/s)*100), pr=s-c; el.innerHTML=`Margin: <b class="${m>=40?'text-green-600':m>=20?'text-amber-600':'text-red-600'}">${m}%</b> · Profit per unit: <b>${MVR(pr)}</b>`; } else el.textContent=''; }
  function loadBatchVariants(selId){ const p=Store.get('products',$('#b_prod').value); const vs=(p&&p.variants)||[];
    $('#b_var').innerHTML = vs.length ? vs.map(v=>`<option value="${v.id}" ${v.id===selId?'selected':''}>${Store.variantTypeLabel(p.variantType)}: ${v.value}</option>`).join('') : `<option value="">— No variants (single stock) —</option>`;
    syncBatchSku(); }
  function syncBatchSku(){ const p=Store.get('products',$('#b_prod').value); const vid=$('#b_var').value; const v=(p&&p.variants||[]).find(x=>x.id===vid)||null; const el=$('#b_sku'); if(el&&p) el.value=Store.skuOfVariant(p,v); }
  function onBatchScan(text){ const el=$('#b_sku'); if(el)el.value=text; resolveBatchSku(text); }
  function resolveBatchSku(sku){
    const r=Store.findBySku(sku);
    if(!r){ toast('No product matches "'+sku+'"'); return; }
    $('#b_prod').value=r.product.id;
    loadBatchVariants(r.variant?r.variant.id:null);
    $('#b_sku').value=Store.skuOfVariant(r.product,r.variant);
    if(!$('#b_sell').value){ $('#b_sell').value=Store.priceOf(r.product)||r.product.price||''; }
    if(!$('#b_cost').value && $('#b_sell').value){ $('#b_cost').value=Math.round((+$('#b_sell').value)*0.58); }
    marginHint();
    toast('Matched: '+r.product.name+(r.variant?' · '+r.variant.value:''));
  }
  function saveBatch(id){
    const pid=$('#b_prod').value; if(!pid)return alert('Select a product');
    Store.upsert('batches',{ id:id||undefined, productId:pid, variantId:$('#b_var').value||null,
      batchNo:$('#b_no').value.trim()||'B-'+Date.now().toString().slice(-4),
      costPrice:+$('#b_cost').value||0, sellingPrice:+$('#b_sell').value||0, stock:+$('#b_stock').value||0,
      expiry:$('#b_exp').value, date:Date.now() });
    closeModal(); inventory();
  }

  function orderDetail(id){
    const o=Store.get('orders',id), idx=Store.ORDER_FLOW.indexOf(o.status);
    const pipe=`<div class="flex flex-wrap mb-5">${Store.ORDER_FLOW.map((st,i)=>{
      const done=i<idx,cur=i===idx;
      return `<div class="flex-1 min-w-[88px] text-center relative pt-6 text-[0.68rem] ${cur?'text-kink font-bold':done?'text-green-600 font-semibold':'text-zinc-400'}">
        <span class="absolute top-0.5 left-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full ${cur?'bg-kacc ring-4 ring-kacc/25':done?'bg-green-600':'bg-zinc-200'} z-10"></span>
        ${i<Store.ORDER_FLOW.length-1?`<span class="absolute top-2 left-1/2 w-full h-0.5 ${done?'bg-green-600':'bg-zinc-200'}"></span>`:''}
        ${st}</div>`;}).join('')}</div>`;
    const canAdv=idx<Store.ORDER_FLOW.length-1 && o.status!=='Returned';
    openModal('Order '+o.id, pipe+
      `<div class="flex gap-2 flex-wrap mb-4">
        ${canAdv?`<button onclick="advance('${o.id}')" class="${btn.primary} ${btn.sm}">Advance → ${Store.ORDER_FLOW[idx+1]}</button>`:''}
        ${o.status==='Delivered'?`<button onclick="setStatus('${o.id}','Returned')" class="${btn.light} ${btn.sm}">↩ Create Return</button>`:''}
        <select onchange="setStatus('${o.id}',this.value)" class="px-3 py-1.5 border border-zinc-300 rounded-lg text-xs"><option>Set status…</option>${Store.ORDER_FLOW.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      ${F.label('Customer')}<div class="text-sm mb-3">${o.userName} · ${o.userPhone}<div class="text-zinc-400">${o.address}</div></div>
      ${F.label('Items')}
      ${o.items.map(it=>`<div class="flex gap-3 items-center py-2 border-b border-zinc-100">
        <img src="${it.image}" class="w-11 h-11 rounded-lg object-cover bg-zinc-100"/>
        <div class="flex-1"><div class="text-sm font-semibold">${it.name}</div><div class="text-xs text-zinc-400">${MVR(it.price)} × ${it.qty}</div></div>
        <div class="font-bold">${MVR(it.price*it.qty)}</div></div>`).join('')}
      <div class="flex justify-between font-extrabold text-base mt-3"><span>Total</span><span>${MVR(total(o))}</span></div>`,
      `<button onclick="closeModal()" class="${btn.light}">Close</button>`);
  }
  function advance(id){ Store.advanceOrder(id); refreshBadge(); orderDetail(id); orders(); }
  function setStatus(id,st){ if(st==='Set status…')return; Store.setOrderStatus(id,st); refreshBadge(); orderDetail(id); orders(); }

      ${F.label('Addresses')}${(u.addresses||[]).map(a=>`<div class="border border-zinc-200 rounded-lg p-3 mb-2 text-sm">
        <b>${a.label||'Address'}</b>${a.isDefault?' '+pill('Default','green'):''}<br/>${a.line}, ${a.city}, ${a.postcode||''}<br/>${a.country}
        ${a.lat?`<div class="text-zinc-400 text-xs mt-1">📍 ${(+a.lat).toFixed(4)}, ${(+a.lng).toFixed(4)}</div>`:''}</div>`).join('')||'<p class="text-sm text-zinc-400 mb-3">No saved addresses</p>'}
      <div class="mt-2">${F.label('Order history ('+os.length+')')}${os.map(o=>`<div class="flex justify-between text-sm py-1.5 border-b border-zinc-100"><span class="font-mono text-xs">${o.id}</span>${statusPill(o.status)}</div>`).join('')||'<p class="text-sm text-zinc-400">No orders</p>'}</div>`,
      `<button onclick="closeModal()" class="${btn.light}">Close</button>`);
  }

  /* init */
  window.addEventListener('error', e => { try{ toast('⚠ '+(e.message||'Script error')); }catch(_){} });
  refreshBadge();
  go((location.hash||'#dashboard').slice(1));
  icons(); // render static nav icons
</script>
</body>
</html>
