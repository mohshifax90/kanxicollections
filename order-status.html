<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Kanxi Collection — Order Status</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f6fb;--panel:#fff;--soft:#f8fafc;--blue:#4f5cf0;--blue-dark:#4250ec;--green:#0f9f62;--amber:#d97706;--red:#dc2626}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    button,input{font:inherit}
    .app{max-width:560px;margin:0 auto;min-height:100vh;padding:1rem .9rem 2rem}
    .hero{padding:.45rem 0 .9rem}
    .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .title{font-size:1.25rem;font-weight:900;margin-top:.38rem}
    .subtitle{font-size:.88rem;color:var(--muted);line-height:1.55;margin-top:.32rem}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:1rem}
    .stack{display:grid;gap:1rem}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;color:var(--muted)}
    .amount{font-size:1.45rem;font-weight:900;margin-top:.35rem}
    .receipt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.9rem;border-bottom:1px dashed var(--line);padding-bottom:.95rem;margin-bottom:.95rem}
    .receipt-brand{font-size:1rem;font-weight:900;letter-spacing:.08em}
    .receipt-copy{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:.18rem}
    .receipt-meta{font-size:.8rem;color:var(--muted);text-align:right;line-height:1.55}
    .pill{display:inline-flex;align-items:center;padding:.3rem .7rem;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1rem}
    .meta-item{padding:.82rem .9rem;border-radius:18px;background:var(--soft);border:1px solid #eef2f7}
    .meta-label{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}
    .meta-value{font-size:.88rem;font-weight:700;line-height:1.45}
    .status-block{margin-top:1.15rem}
    .status-desktop{display:none}
    .status-mobile{border:1px solid var(--line);border-radius:18px;background:var(--soft);overflow:hidden}
    .status-mobile summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.85rem;padding:.95rem 1rem;cursor:pointer}
    .status-mobile summary::-webkit-details-marker{display:none}
    .status-summary-copy{display:grid;gap:.18rem}
    .status-summary-label{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .status-summary-value{font-size:.95rem;font-weight:900;color:var(--ink)}
    .status-summary-meta{font-size:.78rem;color:var(--muted)}
    .status-chevron{width:2rem;height:2rem;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);font-size:1rem;color:var(--muted);transition:transform .2s ease}
    .status-mobile[open] .status-chevron{transform:rotate(180deg)}
    .status-mobile-body{padding:0 1rem 1rem}
    .status-mobile-list{display:grid;gap:.12rem}
    .status-mobile-step{display:grid;grid-template-columns:20px 1fr;gap:.8rem;position:relative;padding:0 0 .85rem}
    .status-mobile-step:last-child{padding-bottom:0}
    .status-mobile-step:last-child::after{display:none}
    .status-mobile-step::after{content:"";position:absolute;left:9px;top:18px;bottom:-2px;width:2px;background:#d1d5db}
    .status-mobile-step.done::after{background:var(--green)}
    .status-mobile-step.active::after{background:linear-gradient(to bottom,var(--blue),#d1d5db)}
    .status-mobile-dot{width:1.05rem;height:1.05rem;border-radius:999px;background:#d1d5db;position:relative;z-index:1;margin-top:.1rem}
    .status-mobile-step.done .status-mobile-dot{background:var(--green)}
    .status-mobile-step.active .status-mobile-dot{background:var(--blue);box-shadow:0 0 0 5px rgba(79,92,240,.14)}
    .status-mobile-content{padding-top:.02rem}
    .status-mobile-name{font-size:.92rem;font-weight:800;color:var(--ink);line-height:1.35}
    .status-mobile-step.done .status-mobile-name{color:var(--green)}
    .status-mobile-step.active .status-mobile-name{color:var(--blue)}
    .status-mobile-note{font-size:.78rem;color:var(--muted);margin-top:.18rem}
    .pipe{display:flex;flex-wrap:wrap}
    .step{flex:1;min-width:84px;text-align:center;position:relative;padding-top:1.45rem;font-size:.66rem}
    .step-dot{position:absolute;top:.15rem;left:50%;transform:translateX(-50%);width:.82rem;height:.82rem;border-radius:999px;background:#d1d5db;z-index:2}
    .step-line{position:absolute;top:.52rem;left:50%;width:100%;height:2px;background:#d1d5db}
    .step.active{color:var(--ink);font-weight:800}
    .step.done{color:var(--green);font-weight:800}
    .step.done .step-dot{background:var(--green)}
    .step.active .step-dot{background:var(--blue);box-shadow:0 0 0 5px rgba(79,92,240,.14)}
    .step.done .step-line{background:var(--green)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:.9rem;padding:.38rem 0;color:var(--muted);font-size:.92rem}
    .row.total{margin-top:.75rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--ink);font-size:1rem;font-weight:900}
    .section-title{font-size:.98rem;font-weight:900;margin-bottom:.75rem}
    .items{display:grid;gap:.8rem}
    .item{display:grid;grid-template-columns:64px 1fr auto;gap:.75rem;align-items:center}
    .item img{width:64px;height:72px;border-radius:16px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
    .item-name{font-size:.9rem;font-weight:800;line-height:1.35}
    .item-sub{font-size:.78rem;color:var(--muted);line-height:1.4;margin-top:.18rem}
    .item-price{font-size:.88rem;font-weight:900;white-space:nowrap}
    .address-lines{font-size:.88rem;color:var(--muted);line-height:1.6}
    .info-banner{margin-top:1rem;padding:.9rem 1rem;border-radius:18px;border:1px solid #dbe4ff;background:#eef2ff}
    .info-banner-title{font-size:.88rem;font-weight:800;color:var(--ink)}
    .info-banner-copy{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:.2rem}
    .bank-box{margin-top:.7rem;display:grid;gap:.5rem}
    .bank-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.65rem .8rem;background:#fff;border:1px solid #dbe4ff;border-radius:14px}
    .bank-label{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .bank-value{font-size:.9rem;font-weight:800;color:var(--ink)}
    .location-card{margin-top:1rem;padding:1rem;border-radius:18px;border:1px solid #dbe4ff;background:#f8fbff}
    .location-card-title{font-size:.88rem;font-weight:800;color:var(--ink)}
    .location-card-copy{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:.2rem}
    .payment-panel{margin-top:1rem;padding:1rem;border-radius:18px;border:1px solid #e7eaf3;background:#fbfcff}
    .payment-grid{display:grid;gap:.75rem;margin-top:.8rem}
    .pay-option{border:1px solid var(--line);border-radius:16px;padding:.9rem;background:#fff;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem}
    .pay-option.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,92,240,.10)}
    .pay-title{font-size:.92rem;font-weight:800;color:var(--ink)}
    .pay-copy{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:.15rem}
    .pay-dot{width:1.05rem;height:1.05rem;border-radius:999px;border:2px solid #cbd5e1;flex:0 0 auto;margin-top:.15rem}
    .pay-option.active .pay-dot{border-color:var(--blue);background:var(--blue)}
    .slip-box{display:grid;gap:.7rem;margin-top:.8rem}
    .slip-thumb{width:100%;max-width:180px;aspect-ratio:4/3;border:1px dashed #cbd5e1;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer}
    .slip-thumb img{width:100%;height:100%;object-fit:cover}
    .actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:none;border-radius:14px;padding:.92rem 1rem;font-weight:800;cursor:pointer}
    .btn-primary{background:var(--blue);color:#fff}
    .btn-primary:hover{background:var(--blue-dark)}
    .btn-light{background:#eef2f7;color:var(--ink)}
    .verify-card{display:grid;gap:.8rem}
    .verify-copy{font-size:.9rem;color:var(--muted);line-height:1.55}
    .field label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
    .field input{width:100%;border:1px solid var(--line);border-radius:14px;padding:.92rem .95rem;background:#fff;outline:none}
    .field input:focus{border-color:var(--blue)}
    .helper{font-size:.8rem;color:var(--muted);line-height:1.5}
    .otp-actions{display:flex;gap:.7rem;flex-wrap:wrap}
    .otp-box{display:grid;gap:.7rem;padding:.85rem;border:1px solid #e7eaf3;border-radius:18px;background:#fbfcff}
    .otp-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
    .otp-row strong{font-size:.92rem}
    .otp-input{width:100%;border:1px solid var(--line);border-radius:14px;padding:.92rem .95rem;background:#fff;outline:none;text-align:center;font-size:1.1rem;font-weight:800;letter-spacing:.22em}
    .otp-input:focus{border-color:var(--blue)}
    .inline-btn{background:none;border:none;color:var(--blue);font-weight:700;padding:0;cursor:pointer}
    .empty{padding:1.6rem;text-align:center;color:var(--muted)}
    .toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(2rem);background:#111827;color:#fff;padding:.82rem 1.15rem;border-radius:12px;font-size:.84rem;opacity:0;transition:.24s;z-index:20}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    @media (min-width:620px){
      .app{padding-top:1.4rem}
      .status-mobile{display:none}
      .status-desktop{display:block}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="eyebrow">Kanxi Collection</div>
      <div class="title">Receipt & Order Status</div>
      <div class="subtitle">Track the order and keep a clean receipt view from the secure link sent to your phone.</div>
    </div>

    <div id="verifyCard" class="card verify-card">
      <div class="section-title">Verify Order</div>
      <div id="verifyCardInner"></div>
    </div>

    <div id="orderPanel" class="stack" style="display:none"></div>
  </div>

  <script src="assets/icons.js?v=2"></script>
  <script src="assets/supabase-config.js?v=2"></script>
  <script src="assets/store.js?v=16"></script>
  <script>
    const $ = s => document.querySelector(s);
    const query = new URLSearchParams(location.search);
    const orderId = query.get('order') || '';
    const receiptRef = (query.get('r') || '').trim();
    const phoneFromUrl = ((query.get('phone') || '').replace(/\D/g,'')).slice(-7);
    const fullPhoneFromUrl = (query.get('phone') || '').replace(/\D/g,'');
    let verifyState = { mode:'legacy', step:'phone', requestId:'', order:null, phone:'' };
    let selectedPaymentMethod = '';
    let transferSlipImage = '';
    const MVR = n => 'MVR ' + (+n || 0).toLocaleString();
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function showToast(msg){
      let t = document.getElementById('toast');
      if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2300);
    }
    async function callOtpApi(path, payload){
      const response = await fetch(path, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(payload)
      });
      let data = {};
      try{ data = await response.json(); }catch(_){}
      if(!response.ok) throw new Error(data.error || data.message || 'OTP request failed');
      return data;
    }
    function phoneKey(value){ return Store.phoneKey ? Store.phoneKey(value) : String(value || '').replace(/\D/g,''); }
    function maskPhone(phone){
      const digits = String(phone || '').replace(/\D/g,'');
      return digits.length >= 7 ? `${digits.slice(0,3)} ${digits.slice(3)}` : digits;
    }
    function moneyTotal(order){
      return (order.items || []).reduce((sum, item) => sum + (+item.price || 0) * (+item.qty || 0), 0) + (+order.shipping || 0);
    }
    function tone(status){
      const map = {
        'Pending Payment':['#fdf3e3','#d97706'],
        'Pending Slip Verification':['#fdf3e3','#d97706'],
        'Paid':['#eef2ff','#4f5cf0'],
        'Order Accepted':['#eef2ff','#4f5cf0'],
        'Packing':['#f5f3ff','#7c3aed'],
        'Ready to Dispatch':['#f5f3ff','#7c3aed'],
        'Out for Delivery':['#eef2ff','#4f5cf0'],
        'Payment Collected':['#eef2ff','#4f5cf0'],
        'Delivered':['#e8f7ee','#0f9f62'],
        'Returned':['#feeceb','#dc2626']
      };
      return map[status] || ['#eef2f7','#6b7280'];
    }
    function timeLabel(ts){
      if(!ts) return '—';
      return new Date(ts).toLocaleString();
    }
    function isCod(order){
      return String(order && (order.payMethodKey || order.payMethod) || '').toLowerCase() === 'cod';
    }
    function activeBankTransfer(){
      const settings = Store.getPaymentSettings ? Store.getPaymentSettings() : null;
      const methods = settings && Array.isArray(settings.methods) ? settings.methods : [];
      const transfer = methods.find(method => String(method && method.key || '') === 'transfer');
      if(transfer && transfer.enabled === false) return null;
      const details = settings && settings.bankTransfer || {};
      if(!details.bankName && !details.accountNumber) return null;
      return details;
    }
    function hasGeo(order){
      const meta = order && order.addressMeta;
      return !!(meta && meta.lat != null && meta.lng != null && !Number.isNaN(+meta.lat) && !Number.isNaN(+meta.lng));
    }
    function paymentChoices(order){
      return Store.paymentOptionsForOrder ? Store.paymentOptionsForOrder(order) : [];
    }
    function paySubtitle(key){
      if(key === 'transfer') return 'Upload transfer slip for admin verification.';
      if(key === 'card') return 'Complete payment now with the active card method.';
      if(key === 'paypal') return 'Complete payment now with the active PayPal method.';
      return 'Complete payment using this active method.';
    }
    function renderVerifyCard(){
      const order = verifyState.order;
      if(verifyState.mode === 'otp' && order){
        const copy = verifyState.step === 'phone'
          ? 'For this secure payment link, send a one-time code to the mobile number on the order.'
          : 'Enter the OTP sent to the mobile number on this order to unlock receipt details and payment options.';
        $('#verifyCardInner').innerHTML = `
          <div class="verify-copy">${copy}</div>
          ${verifyState.step === 'phone' ? `
            <div class="otp-box">
              <div class="otp-row"><span>Send OTP to</span><strong>${esc(maskPhone(order.userPhone || ''))}</strong></div>
              <div class="otp-actions">
                <button class="btn btn-primary" type="button" onclick="sendOrderOtp()">Send OTP</button>
              </div>
            </div>` : `
            <div class="otp-box">
              <div class="otp-row"><strong>${esc(maskPhone(order.userPhone || ''))}</strong><button class="inline-btn" type="button" onclick="resetOrderOtp()">Edit</button></div>
              <input id="otpInput" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000"/>
              <div class="otp-actions">
                <button class="btn btn-primary" type="button" onclick="verifyOrderOtp()">Verify OTP</button>
                <button class="btn btn-light" type="button" onclick="sendOrderOtp(true)">Resend OTP</button>
              </div>
            </div>`}
          <div class="helper">We only unlock order details for the customer tied to this order.</div>
        `;
        return;
      }
      $('#verifyCardInner').innerHTML = `
        <div class="verify-copy">Enter the 7-digit mobile number used for the order if it is not already filled in from your SMS link.</div>
        <div class="field">
          <label for="phoneInput">Mobile Number</label>
          <input id="phoneInput" inputmode="numeric" maxlength="7" placeholder="Enter 7-digit mobile number"/>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="button" onclick="verifyOrder()">View Order</button>
        </div>
        <div class="helper">We only show receipt details for the phone number tied to this order.</div>
      `;
      if(phoneFromUrl) document.getElementById('phoneInput').value = phoneFromUrl;
    }
    function statusPipe(order){
      const flow = Store.getOrderFlow ? Store.getOrderFlow(order) : ['Pending Payment','Pending Slip Verification','Paid','Order Accepted','Packing','Ready to Dispatch','Out for Delivery','Delivered','Returned'];
      const idx = flow.indexOf(order.status);
      const currentIndex = idx >= 0 ? idx : 0;
      const currentStep = flow[currentIndex] || order.status || 'Order Placed';
      const completedCount = Math.max(1, currentIndex + 1);
      return `
        <div class="status-block">
          <details class="status-mobile">
            <summary>
              <div class="status-summary-copy">
                <div class="status-summary-label">Order Progress</div>
                <div class="status-summary-value">${esc(currentStep)}</div>
                <div class="status-summary-meta">Step ${completedCount} of ${flow.length}</div>
              </div>
              <span class="status-chevron">⌄</span>
            </summary>
            <div class="status-mobile-body">
              <div class="status-mobile-list">
                ${flow.map((step, i) => `
                  <div class="status-mobile-step ${i < currentIndex ? 'done' : i === currentIndex ? 'active' : ''}">
                    <span class="status-mobile-dot"></span>
                    <div class="status-mobile-content">
                      <div class="status-mobile-name">${esc(step)}</div>
                      ${i === currentIndex ? '<div class="status-mobile-note">Current order status</div>' : ''}
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </details>
          <div class="status-desktop">
            <div class="pipe">${flow.map((step, i) => `
              <div class="step ${i < currentIndex ? 'done' : i === currentIndex ? 'active' : ''}">
                <span class="step-dot"></span>
                ${i < flow.length - 1 ? `<span class="step-line"></span>` : ''}
                ${esc(step)}
              </div>`).join('')}</div>
          </div>
        </div>`;
    }
    function addressLines(order){
      const meta = order.addressMeta || null;
      const out = [];
      if(meta && meta.line) out.push(meta.line);
      if(meta && (meta.city || meta.atoll)) out.push([meta.city, meta.atoll].filter(Boolean).join(', '));
      if(meta && (meta.postcode || meta.country)) out.push([meta.postcode, meta.country].filter(Boolean).join(' · '));
      if(order.deliveryType) out.push(Store.deliveryLabel ? Store.deliveryLabel(order.deliveryType) : order.deliveryType);
      return out.filter(Boolean);
    }
    function renderOrder(order){
      const [bg, fg] = tone(order.status);
      const subtotal = (order.items || []).reduce((sum, item) => sum + (+item.price || 0) * (+item.qty || 0), 0);
      const tax = Store.taxAmountFromInclusive ? Store.taxAmountFromInclusive(subtotal) : 0;
      const address = addressLines(order);
      const bankTransfer = isCod(order) && order.payStatus !== 'Paid' ? activeBankTransfer() : null;
      const needsLocationUpdate = !hasGeo(order) && !!receiptRef;
      const payChoices = isCod(order) && order.payStatus !== 'Paid' ? paymentChoices(order) : [];
      if(payChoices.length && !payChoices.some(method => method.key === selectedPaymentMethod)) selectedPaymentMethod = payChoices[0].key;
      $('#orderPanel').style.display = 'grid';
      $('#orderPanel').innerHTML = `
        <div class="card">
          <div class="receipt-head">
            <div>
              <div class="receipt-brand">KANXI COLLECTION</div>
              <div class="receipt-copy">Receipt ref ${esc(order.publicRef || '')}</div>
            </div>
            <div class="receipt-meta">
              <div>Order ${esc(order.id)}</div>
              <div>${timeLabel(order.date)}</div>
            </div>
          </div>
          <div class="top">
            <div>
              <div class="mono">Total Due</div>
              <div class="amount">${MVR(moneyTotal(order))}</div>
            </div>
            <span class="pill" style="background:${bg};color:${fg}">${esc(order.status)}</span>
          </div>
          <div class="meta">
            <div class="meta-item"><div class="meta-label">Placed</div><div class="meta-value">${timeLabel(order.date)}</div></div>
            <div class="meta-item"><div class="meta-label">Payment</div><div class="meta-value">${esc(order.payMethod || '—')} · ${esc(order.payStatus || '—')}</div></div>
            <div class="meta-item"><div class="meta-label">Customer</div><div class="meta-value">${esc(order.userName || 'Customer')}</div></div>
            <div class="meta-item"><div class="meta-label">Phone</div><div class="meta-value">${esc(order.userPhone || '—')}</div></div>
          </div>
          ${statusPipe(order)}
          ${bankTransfer ? `
            <div class="info-banner">
              <div class="info-banner-title">Cash on Delivery alternative payment</div>
              <div class="info-banner-copy">This order is still unpaid. If the customer wants to complete payment by transfer, use the currently active bank transfer details below.</div>
              <div class="bank-box">
                <div class="bank-row"><div><div class="bank-label">Bank Name</div><div class="bank-value">${esc(bankTransfer.bankName || '—')}</div></div></div>
                <div class="bank-row"><div><div class="bank-label">Account Number</div><div class="bank-value">${esc(bankTransfer.accountNumber || '—')}</div></div></div>
              </div>
            </div>` : ''}
          ${payChoices.length ? `
            <div class="payment-panel">
              <div class="info-banner-title">Make Payment</div>
              <div class="info-banner-copy">Choose any active payment method except Cash on Delivery.</div>
              <div class="payment-grid">
                ${payChoices.map(method => `
                  <button class="pay-option ${method.key===selectedPaymentMethod?'active':''}" type="button" onclick="selectPublicPaymentMethod('${method.key}')">
                    <div>
                      <div class="pay-title">${esc(method.label)}</div>
                      <div class="pay-copy">${esc(paySubtitle(method.key))}</div>
                    </div>
                    <span class="pay-dot"></span>
                  </button>`).join('')}
              </div>
              ${selectedPaymentMethod === 'transfer' ? `
                <div class="slip-box">
                  <label class="slip-thumb" for="transferSlipInput">
                    ${transferSlipImage ? `<img src="${esc(transferSlipImage)}" alt="Transfer slip"/>` : `<span class="pay-copy">Tap to upload transfer slip</span>`}
                  </label>
                  <input id="transferSlipInput" type="file" accept="image/*" style="display:none" onchange="onTransferSlipSelected(this)"/>
                </div>` : ''}
              <div class="actions">
                <button class="btn btn-primary" type="button" onclick="submitPublicPayment()">Make Payment</button>
              </div>
            </div>` : ''}
        </div>

        <div class="card">
          <div class="section-title">Receipt</div>
          <div class="items">
            ${(order.items || []).map(item => `
              <div class="item">
                <img src="${esc(item.image || '')}" alt="${esc(item.name || 'Item')}"/>
                <div>
                  <div class="item-name">${esc(item.name || 'Item')}</div>
                  <div class="item-sub">${esc(item.size || 'Standard')} · Qty ${+item.qty || 0}</div>
                </div>
                <div class="item-price">${MVR((+item.price || 0) * (+item.qty || 0))}</div>
              </div>`).join('')}
          </div>
          <div class="row"><span>Subtotal</span><span>${MVR(subtotal)}</span></div>
          <div class="row"><span>Included Tax</span><span>${MVR(tax)}</span></div>
          <div class="row"><span>Shipping</span><span>${MVR(+order.shipping || 0)}</span></div>
          <div class="row total"><span>Total</span><span>${MVR(moneyTotal(order))}</span></div>
        </div>

        <div class="card">
          <div class="section-title">Delivery Details</div>
          <div class="address-lines">${address.length ? address.map(line => `<div>${esc(line)}</div>`).join('') : '<div>No address details available.</div>'}</div>
          ${needsLocationUpdate ? `
            <div class="location-card">
              <div class="location-card-title">Update Current Location</div>
              <div class="location-card-copy">Your order does not have live geo location yet. Tap below to share your current location for delivery.</div>
              <div class="actions">
                <button class="btn btn-primary" type="button" onclick="shareCurrentLocation()">Update Current Location</button>
              </div>
            </div>` : ''}
          <div class="actions">
            <button class="btn btn-light" type="button" onclick="window.print()">Print Receipt</button>
            <a class="btn btn-primary" href="index.html">Continue Shopping</a>
          </div>
        </div>
      `;
    }
    function findOrderByPhone(phoneDigits){
      const digits = String(phoneDigits || '').replace(/\D/g,'');
      const list = Store.list('orders');
      if(receiptRef && Store.getOrderByPublicRef){
        const byRef = Store.getOrderByPublicRef(receiptRef);
        if(byRef && phoneKey(byRef.userPhone).endsWith(digits)) return byRef;
      }
      if(orderId) return list.find(order => order.id === orderId && phoneKey(order.userPhone).endsWith(digits));
      return null;
    }
    function selectPublicPaymentMethod(key){
      selectedPaymentMethod = key;
      if(key !== 'transfer') transferSlipImage = '';
      if(verifyState.order) renderOrder(verifyState.order);
    }
    function onTransferSlipSelected(input){
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        transferSlipImage = String(event.target && event.target.result || '');
        if(verifyState.order) renderOrder(verifyState.order);
      };
      reader.readAsDataURL(file);
      input.value = '';
    }
    async function submitPublicPayment(){
      if(!receiptRef || !verifyState.order) return showToast('Missing payment link');
      if(!selectedPaymentMethod) return showToast('Select a payment method');
      if(selectedPaymentMethod === 'transfer' && !transferSlipImage) return showToast('Upload transfer slip');
      try{
        const order = await Store.convertOrderPaymentByRef(receiptRef, selectedPaymentMethod, { transferSlip: transferSlipImage });
        verifyState.order = order;
        transferSlipImage = '';
        selectedPaymentMethod = '';
        renderOrder(order);
        showToast(order.payStatus === 'Paid' ? 'Payment completed' : 'Transfer submitted for verification');
      }catch(error){
        showToast(error.message || 'Could not complete payment');
      }
    }
    function verifyOrder(){
      const digits = String($('#phoneInput').value || '').replace(/\D/g,'').slice(-7);
      if(digits.length !== 7) return showToast('Enter the 7-digit mobile number');
      const order = findOrderByPhone(digits);
      if(!order){
        $('#orderPanel').style.display = 'none';
        return showToast('Order not found for this number');
      }
      renderOrder(order);
      $('#verifyCard').style.display = 'none';
    }
    async function sendOrderOtp(resend){
      const order = verifyState.order;
      if(!order) return;
      try{
        const payload = { phone_number: String(order.userPhone || '').replace(/\D/g,'') };
        const data = await callOtpApi(resend && verifyState.requestId ? '/api/msgowl-resend-otp' : '/api/msgowl-send-otp', resend && verifyState.requestId ? { ...payload, request_id: verifyState.requestId } : payload);
        verifyState.requestId = data.request_id || data.requestId || verifyState.requestId || '';
        verifyState.step = 'otp';
        renderVerifyCard();
        showToast(resend ? 'OTP resent' : 'OTP sent');
      }catch(error){
        showToast(error.message || 'Could not send OTP');
      }
    }
    function resetOrderOtp(){
      verifyState.step = 'phone';
      verifyState.requestId = '';
      renderVerifyCard();
    }
    async function verifyOrderOtp(){
      const order = verifyState.order;
      if(!order) return;
      const code = String(document.getElementById('otpInput')?.value || '').replace(/\D/g,'');
      if(code.length !== 6) return showToast('Enter the 6-digit OTP');
      try{
        const data = await callOtpApi('/api/msgowl-verify-otp', { phone_number: String(order.userPhone || '').replace(/\D/g,''), code });
        if(data.status !== true) return showToast(data.message || 'Invalid OTP');
        renderOrder(order);
        $('#verifyCard').style.display = 'none';
      }catch(error){
        showToast(error.message || 'Could not verify OTP');
      }
    }
    async function shareCurrentLocation(){
      if(!receiptRef) return showToast('Missing receipt link');
      if(!navigator.geolocation) return showToast('Geolocation not supported');
      navigator.geolocation.getCurrentPosition(async pos => {
        try{
          const payload = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };
          try{
            const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${payload.lat}&lon=${payload.lng}&zoom=18&addressdetails=1`, { headers:{ Accept:'application/json' } });
            const data = await r.json();
            const addr = data.address || {};
            payload.line = data.display_name || `Near ${payload.lat.toFixed(4)}, ${payload.lng.toFixed(4)}`;
            payload.city = addr.city || addr.town || addr.village || '';
            payload.atoll = addr.state || addr.county || '';
            payload.postcode = addr.postcode || '';
            payload.country = addr.country || 'Maldives';
          }catch(_){
            payload.line = `Near ${payload.lat.toFixed(4)}, ${payload.lng.toFixed(4)}`;
            payload.country = 'Maldives';
          }
          const order = await Store.updateOrderLocation(receiptRef, payload);
          renderOrder(order);
          showToast('Current location updated');
        }catch(error){
          showToast(error.message || 'Could not update location');
        }
      }, ()=>showToast('Could not get current location'), { enableHighAccuracy:true, timeout:10000 });
    }
    function boot(){
      renderVerifyCard();
      if(!orderId && !receiptRef){
        $('#verifyCard').innerHTML = '<div class="empty">Missing order link details.</div>';
        return;
      }
      if(location.protocol !== 'file:'){
        Store.syncFromCloud().finally(() => {
          if(phoneFromUrl || fullPhoneFromUrl){
            const order = findOrderByPhone(phoneFromUrl || fullPhoneFromUrl);
            if(order){
              renderOrder(order);
              $('#verifyCard').style.display = 'none';
            }
          }else if(receiptRef && Store.getOrderByPublicRef){
            const order = Store.getOrderByPublicRef(receiptRef);
            if(order){
              verifyState = { mode:'otp', step:'phone', requestId:'', order, phone:String(order.userPhone || '') };
              renderVerifyCard();
            }
          }
        });
      }
    }
    boot();
  </script>
</body>
</html>
