<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kanxi Collection — Category</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:#1a1814; --white:#fff; --gray-100:#f8f5f1; --gray-200:#ede8e0;
      --gray-400:#b0a898; --gray-600:#6e6860; --accent:#b89b7a; --cream:#f5ede0;
      --ink:#1a1814; --muted:#8b8b8b; --line:#efefef;
    }
    body { font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:#e9e9e9; -webkit-font-smoothing:antialiased; }
    a { text-decoration:none; color:inherit; }
    ::selection { background:var(--accent); color:#fff; }
    .app { max-width:480px; margin:0 auto; background:#fff; min-height:100vh; box-shadow:0 0 40px rgba(0,0,0,0.08); }

    /* header */
    .shop-head { position:sticky; top:0; z-index:50; background:#fff; display:flex; align-items:center; gap:0.7rem; padding:0.8rem 1rem; border-bottom:1px solid var(--line); }
    .icon-btn { background:none; border:none; cursor:pointer; font-size:1.3rem; color:var(--ink); display:flex; align-items:center; justify-content:center; }
    .back-btn { width:44px; height:44px; margin-left:-10px; display:flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; border-radius:50%; -webkit-tap-highlight-color:transparent; transition:background 0.15s; flex-shrink:0; }
    .back-btn:active { background:#f0f0f0; }
    .back-btn svg { width:25px; height:25px; color:var(--ink); }
    .shop-avatar { width:42px; height:42px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--gray-200); flex-shrink:0; }
    .shop-avatar svg { height:28px; }
    .head-id { display:flex; flex-direction:column; line-height:1.15; }
    .head-id .nm { font-size:0.98rem; font-weight:700; display:flex; align-items:center; gap:4px; }
    .head-id .nm .verified { color:var(--accent); font-size:0.8rem; }
    .head-id .vs { font-size:0.82rem; color:#3a7bd5; font-weight:600; }
    .spacer { flex:1; }
    .heart-btn svg { width:26px; height:26px; fill:var(--black); transition:fill 0.2s, transform 0.15s; display:block; }
    .heart-btn:hover svg { fill:var(--accent); transform:scale(1.08); }
    .heart-btn.saved svg { fill:#e0413b; }
    .bag-btn { width:28px; height:28px; background:url('assets/bag-main.svg') center/contain no-repeat; transition:transform 0.15s; position:relative; }
    .bag-btn:hover { transform:scale(1.08); }
    .menu-btn { width:28px; height:28px; padding:0; }
    .menu-btn svg { width:28px; height:28px; stroke-width:2.1; display:block; }
    .cart-wrap { position:relative; }
    .cart-dot { position:absolute; top:-6px; right:-7px; background:var(--accent); color:#fff; font-size:0.58rem; font-weight:700; border-radius:50%; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

    /* title block */
    .titleblock { padding:1.2rem 1rem 0.5rem; }
    .titleblock h1 { font-size:1.9rem; font-weight:800; letter-spacing:-0.02em; line-height:1.1; margin-bottom:0.6rem; }
    .titleblock .desc { font-size:0.95rem; color:#333; line-height:1.5; }
    .titleblock .desc .more { color:var(--muted); font-weight:600; cursor:pointer; }

    /* category strip */
    .cat-strip { display:flex; gap:0.7rem; padding:1.1rem 1rem 0.5rem; overflow-x:auto; scrollbar-width:none; }
    .cat-strip::-webkit-scrollbar { display:none; }
    .cat-card { flex-shrink:0; width:118px; aspect-ratio:118/96; border-radius:12px; overflow:hidden; position:relative; cursor:pointer; background:var(--gray-100); border:1px solid #e3e3e3; }
    .cat-card img { width:100%; height:100%; object-fit:cover; }
    .cat-card .ov { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.4), transparent 60%); }
    .cat-card.active { outline:2.5px solid var(--accent); outline-offset:-2px; }
    .cat-card .lbl { position:absolute; bottom:0.5rem; left:0.6rem; right:0.6rem; color:#fff; font-size:0.92rem; font-weight:400; line-height:1.1; }

    /* filter row */
    .filter-row { display:flex; gap:0.5rem; padding:0.9rem 1rem 0.3rem; overflow-x:auto; scrollbar-width:none; align-items:center; }
    .filter-row::-webkit-scrollbar { display:none; }
    .fbtn { flex-shrink:0; display:flex; align-items:center; gap:0.35rem; background:#fff; border:1.5px solid #ddd; border-radius:22px; padding:0.5rem 0.9rem; font-size:0.85rem; font-weight:600; color:var(--ink); cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; transition:all 0.18s; }
    .fbtn:hover, .fbtn.active { border-color:var(--black); }
    .fbtn.circle { width:42px; height:42px; padding:0; justify-content:center; border-radius:50%; font-size:1rem; }
    .filter-ico { width:20px; height:20px; color:var(--ink); display:block; }
    .sort-ico { width:20px; height:20px; fill:var(--ink); display:block; }

    .count { padding:0.8rem 1rem 0.4rem; font-size:0.92rem; color:#444; font-weight:500; }

    /* product grid */
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1.3rem 0.8rem; padding:0.3rem 1rem 2rem; }
    .pcard { cursor:pointer; }
    .pcard-img { position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:var(--gray-100); margin-bottom:0.5rem; border:1px solid #e3e3e3; }
    .pcard-img img { width:100%; height:100%; object-fit:cover; transition:transform 0.35s; }
    .pcard:hover .pcard-img img { transform:scale(1.04); }
    .pcard-badge { position:absolute; bottom:0.55rem; left:0.55rem; background:rgba(26,24,20,0.56); color:#fff; font-size:0.68rem; font-weight:700; padding:0.25rem 0.6rem; border-radius:5px; backdrop-filter:blur(2px); }
    .pcard-badge.gold { background:rgba(26,24,20,0.56); }
    .pcard-name-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
    .pcard-name { font-size:0.86rem; font-weight:500; line-height:1.35; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .pcard-heart { background:none; border:none; cursor:pointer; flex-shrink:0; padding:1px 0 0; }
    .pcard-heart svg { width:19px; height:19px; fill:var(--accent); transition:fill 0.2s, transform 0.15s; display:block; }
    .pcard-heart.saved svg { fill:#e0413b; }
    .pcard-heart:active svg { transform:scale(1.25); }
    .pcard-price { font-size:0.88rem; font-weight:700; margin-top:0.25rem; }
    .pcard-price .old { font-weight:400; color:var(--gray-400); text-decoration:line-through; font-size:0.76rem; margin-left:0.3rem; }
    .pcard-status { font-size:0.8rem; color:var(--muted); margin-top:0.2rem; }
    .pcard-status.fast { color:#c0392b; }
    .pcard-status.new { color:var(--accent); }
    .pcard-status.low { color:#d68910; }

    .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(4rem); background:var(--black); color:#fff; padding:0.8rem 1.4rem; border-radius:10px; font-size:0.85rem; z-index:999; opacity:0; transition:all 0.3s; border-left:3px solid var(--accent); }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    /* ── BOTTOM SHEET ── */
    .sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;}
    .sheet-bg.show{display:block;}
    .sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:#fff;z-index:301;border-radius:18px 18px 0 0;transition:transform 0.3s ease;max-height:85vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
    .sheet.show{transform:translateX(-50%) translateY(0);}
    .sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0.7rem auto 0;}
    .sheet-x{position:absolute;top:0.7rem;left:1rem;width:28px;height:28px;border-radius:50%;border:1.5px solid #ddd;background:none;cursor:pointer;font-size:0.85rem;color:#555;display:flex;align-items:center;justify-content:center;}
    .sheet-title{text-align:center;font-size:1.15rem;font-weight:800;padding:0.7rem 1rem 1rem;border-bottom:1px solid var(--line);}
    .sheet-body{overflow-y:auto;flex:1;}
    .sheet-foot{padding:0.9rem 1rem;border-top:1px solid var(--line);}
    .sheet-foot:empty{display:none;}
    /* sort options */
    .sheet-opt{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.3rem;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:0.95rem;font-weight:500;}
    .sheet-opt:hover{background:#fafafa;}
    .radio{width:22px;height:22px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
    .radio.on{border-color:var(--black);}
    .radio.on::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--black);}
    /* accordion */
    .acc{border-bottom:1px solid var(--line);}
    .acc-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.3rem;cursor:pointer;font-size:1rem;font-weight:600;}
    .acc-val{color:var(--muted);font-size:0.9rem;font-weight:500;}
    .acc-body{display:none;padding:0 1.3rem 1.1rem;}
    .acc.open .acc-body{display:block;}
    .fchips{display:flex;flex-wrap:wrap;gap:0.5rem;}
    .fchips.col{flex-direction:column;}
    .fchip{border:1.5px solid var(--gray-200);border-radius:20px;padding:0.45rem 0.95rem;font-size:0.82rem;font-weight:600;cursor:pointer;background:#fff;}
    .fchip.on{background:var(--black);color:#fff;border-color:var(--black);}
    .frow-opt{display:flex;align-items:center;justify-content:space-between;padding:0.7rem 0;font-size:0.92rem;cursor:pointer;}
    .frow-opt input[type=radio]{width:18px;height:18px;accent-color:var(--black);}
    .toggle-row{padding:1.1rem 1.3rem;border-bottom:1px solid var(--line);}
    .tgl{width:46px;height:26px;border-radius:20px;background:#ddd;border:none;cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0;}
    .tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left 0.2s;}
    .tgl.on{background:var(--accent);}
    .tgl.on::after{left:23px;}
    .link-clear{background:none;border:none;color:var(--accent);font-weight:600;font-size:0.85rem;cursor:pointer;padding:0.6rem 0 0;font-family:'Inter',sans-serif;}
    .sheet-apply{width:100%;background:var(--black);color:#fff;border:none;border-radius:12px;padding:1.05rem;font-size:0.95rem;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.2s;}
    .sheet-apply:hover{background:var(--accent);}

    @media (min-width:520px){ body{padding:1.5rem 0;} .app{border-radius:20px; overflow:hidden; min-height:auto;} .sheet{border-radius:18px 18px 20px 20px;} }
  </style>
</head>
<body>
<div class="app">

  <!-- header -->
  <div class="shop-head">
    <button class="back-btn" onclick="location.href='index.html'" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="shop-avatar">
      <svg viewBox="415 270 325 375" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,1254) scale(0.1,-0.1)" stroke="none"><path fill="#1a1814" d="M4477 9643 c-17 -16 -1 -20 91 -26 183 -11 246 -49 285 -171 l22 -71 0 -1290 c0 -1377 1 -1360 -48 -1448 -23 -42 -81 -80 -137 -93 -19 -4 -75 -10 -124 -13 -58 -4 -91 -10 -94 -18 -3 -10 109 -13 537 -13 307 0 542 4 545 9 8 13 -19 21 -73 21 -73 0 -151 27 -186 65 -17 18 -40 57 -51 86 -18 52 -19 95 -22 1334 -2 856 1 1306 8 1360 6 46 21 102 36 132 21 44 34 56 80 79 37 18 78 28 129 33 42 3 76 11 78 16 2 11 -1065 20 -1076 8z"/><g transform="translate(6350,7900) scale(0.78) translate(-6350,-7900)"><path fill="#b89b7a" d="M6540 9635 c0 -11 11 -15 38 -15 47 0 103 -28 121 -61 21 -38 7 -89 -43 -156 -59 -79 -554 -594 -1010 -1050 l-371 -373 81 0 81 0 234 -246 c129 -135 234 -249 234 -252 0 -4 -26 -59 -57 -122 -170 -343 -170 -724 -1 -1065 61 -123 121 -204 227 -310 175 -174 377 -281 656 -346 121 -29 425 -37 568 -15 264 40 518 170 666 340 55 63 106 135 106 148 0 20 -27 5 -49 -27 -33 -49 -157 -165 -227 -212 -266 -181 -601 -236 -926 -154 -385 97 -665 363 -807 765 -78 220 -90 520 -31 752 11 42 22 79 23 81 6 6 225 -220 714 -739 l73 -78 325 0 c196 0 325 4 325 9 0 6 -21 12 -47 16 -139 17 -227 50 -322 119 -60 45 -558 558 -885 913 l-49 53 29 42 c47 70 164 181 249 236 269 176 642 210 967 88 253 -95 464 -300 514 -498 9 -38 21 -68 26 -68 10 0 6 176 -8 362 l-6 77 -47 30 c-169 108 -391 183 -624 212 -123 15 -406 6 -502 -15 -251 -56 -463 -165 -644 -331 l-44 -40 -76 82 c-42 45 -146 157 -231 248 -85 91 -156 172 -158 178 -1 7 271 285 605 618 465 464 626 619 687 659 125 84 213 117 339 129 37 3 69 11 70 16 1 7 -137 11 -395 13 -350 2 -398 0 -398 -13z"/></g></g></svg>
    </div>
    <div class="head-id">
      <span class="nm">kanxi.collection</span>
      <a class="vs" href="index.html">View shop</a>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn heart-btn" title="Wishlist" onclick="this.classList.toggle('saved')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
    <button class="icon-btn cart-wrap" title="Checkout" onclick="location.href='checkout.html'"><span class="bag-btn"></span><span class="cart-dot cart-count" style="display:none">0</span></button>
    <button class="icon-btn menu-btn" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
  </div>

  <!-- title -->
  <div class="titleblock">
    <h1 id="catTitle">Category</h1>
    <p class="desc"><span id="catDesc"></span> <span class="more" id="moreBtn">more</span></p>
  </div>

  <!-- category strip -->
  <div class="cat-strip" id="catStrip"></div>

  <!-- filter row -->
  <div class="filter-row">
    <button class="fbtn circle" title="Filters" onclick="openFilter()"><svg class="filter-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/><circle cx="9" cy="8" r="2.9" fill="#fff"/><circle cx="15" cy="16" r="2.9" fill="#fff"/></svg></button>
    <button class="fbtn circle" title="Sort" onclick="openSort()"><svg class="sort-ico" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 5C7.55228 5 8 5.44772 8 6V15.5858L10.2929 13.2929C10.6834 12.9024 11.3166 12.9024 11.7071 13.2929C12.0976 13.6834 12.0976 14.3166 11.7071 14.7071L7.70711 18.7071C7.31658 19.0976 6.68342 19.0976 6.29289 18.7071L2.29289 14.7071C1.90237 14.3166 1.90237 13.6834 2.29289 13.2929C2.68342 12.9024 3.31658 12.9024 3.70711 13.2929L6 15.5858V6C6 5.44772 6.44772 5 7 5ZM16.2929 5.29289C16.6834 4.90237 17.3166 4.90237 17.7071 5.29289L21.7071 9.29289C22.0976 9.68342 22.0976 10.3166 21.7071 10.7071C21.3166 11.0976 20.6834 11.0976 20.2929 10.7071L18 8.41421V18C18 18.5523 17.5523 19 17 19C16.4477 19 16 18.5523 16 18V8.41421L13.7071 10.7071C13.3166 11.0976 12.6834 11.0976 12.2929 10.7071C11.9024 10.3166 11.9024 9.68342 12.2929 9.29289L16.2929 5.29289Z"/></svg></button>
    <button class="fbtn" id="chipSize" onclick="openFilter('size')">Size ▾</button>
    <button class="fbtn" id="chipPrice" onclick="openFilter('price')">Price ▾</button>
    <button class="fbtn" id="chipStock" onclick="openFilter()">In stock</button>
  </div>

  <p class="count" id="count">0 products</p>

  <!-- grid -->
  <div class="grid-2" id="grid"></div>

</div>

<!-- ── BOTTOM SHEET ── -->
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-x" onclick="closeSheet()">✕</button>
  <h3 class="sheet-title">Sort by</h3>
  <div class="sheet-body"></div>
  <div class="sheet-foot"></div>
</div>

<script src="assets/supabase-config.js?v=1"></script>
<script src="assets/store.js?v=7"></script>
<script src="assets/components.js"></script>
<script>
  /* ── CATEGORY META (page copy) ── */
  const cats = {
    clothing: { title:'Clothing & Apparel', count:'48 products',
      desc:'Curated fashion crafted from premium fabrics — tailored blazers, silk dresses and effortless co-ords designed to elevate your everyday wardrobe with timeless elegance.' },
    skincare: { title:'Skincare & Beauty', count:'28 products',
      desc:'Science-backed, clean formulas that nourish and glow. From brightening serums to deep hydration, discover skincare made to love your skin every single day.' },
    bags: { title:'Bags & Accessories', count:'24 products',
      desc:'Handcrafted leather and canvas bags built to last. Structured totes, sleek crossbodies and weekend carryalls — timeless pieces for the modern individual.' },
    watches: { title:'Watches & Timepieces', count:'18 products',
      desc:'Precision engineering meets refined design. From minimalist classics to bold complications, mark every moment with a Kanxi timepiece built to endure.' },
    sale: { title:'Sale & Offers', count:'20 products',
      desc:'Limited-time savings on season favourites. Premium pieces, timeless style, unbeatable value — shop the edit before it\'s gone.' },
    new: { title:'New Arrivals', count:'26 products',
      desc:'Fresh in this season. The latest drops across fashion, skincare, bags and watches — be the first to wear what\'s next.' },
  };

  function topCategoryStrip(){
    return [
      ...Store.list('categories').filter(c=>c.active).map(c=>({ key:c.slug, label:c.name, img:(Store.cardsBySlug(c.slug)[0]||{}).img, href:`shop.html?cat=${c.slug}` })),
      { key:'sale', label:'Sale', img:(Store.cardsBySlug('sale')[0]||{}).img, href:'shop.html?cat=sale' },
      { key:'new', label:'New In', img:(Store.cardsBySlug('new')[0]||{}).img, href:'shop.html?cat=new' },
    ];
  }

  const params = new URLSearchParams(location.search);
  const tagId = params.get('tag');
  const brandQ = params.get('brand');
  const cat = params.get('cat') || (Store.list('categories')[0]||{}).slug || 'clothing';
  const subId = params.get('sub');
  const currentCategory = Store.categoryBySlug(cat);
  const currentSub = subId ? Store.get('subcategories', subId) : null;

  /* base items + page copy depending on mode (tag / brand / category) */
  let baseItems = [], meta = null, SIZES = [], COLORS = [];
  function refreshBaseItems(){
    const liveCategory = Store.categoryBySlug(cat);
    const liveSub = subId ? Store.get('subcategories', subId) : null;
    if (tagId) {
      const t = Store.list('tags').find(x=>x.id===tagId) || {name:'Collection'};
      baseItems = Store.productsByTag(tagId);
      meta = { title:t.name, desc:`Shop the ${t.name} edit — handpicked pieces from across the Kanxi Collection.` };
    } else if (brandQ) {
      baseItems = Store.productsByBrand(brandQ);
      meta = { title:brandQ, desc:`Explore ${brandQ} — curated styles available at Kanxi Collection.` };
    } else if (liveCategory && liveSub && liveSub.categoryId===liveCategory.id) {
      baseItems = Store.cardsBySub(liveSub.id);
      meta = { title:liveSub.name, desc:`Shop ${liveSub.name} from ${liveCategory.name} — curated pieces available at Kanxi Collection.` };
    } else {
      baseItems = Store.cardsBySlug(cat);
      meta = cats[cat] || { title:(Store.categoryBySlug(cat)||{}).name || 'Shop', desc:'Discover the Kanxi Collection edit — curated quality, timeless style.' };
    }
    SIZES = [...new Set(baseItems.flatMap(p=>p.sizes))];
    COLORS = [...new Set(baseItems.flatMap(p=>p.colors))];
  }
  refreshBaseItems();
  const activeKey = tagId||brandQ ? '' : (subId || cat);

  function renderCategoryChrome(){
    const liveCategory = Store.categoryBySlug(cat);
    document.title = 'Kanxi — ' + meta.title;
    document.getElementById('catTitle').textContent = meta.title;
    document.getElementById('catDesc').textContent = meta.desc.slice(0,120) + '…';
    document.getElementById('moreBtn').onclick = function(){ document.getElementById('catDesc').textContent = meta.desc; this.style.display='none'; };

    const subcategories = liveCategory ? Store.subcategoriesOf(liveCategory.id) : [];
    const stripCards = (!tagId && !brandQ && subcategories.length)
      ? subcategories.map(s=>({ key:s.id, label:s.name, img:Store.imageForSub(s.id), href:`shop.html?cat=${cat}&sub=${s.id}` }))
      : topCategoryStrip();
    document.getElementById('catStrip').innerHTML = stripCards.map(c =>
      `<a class="cat-card ${c.key===activeKey?'active':''}" href="${c.href}">
        <img src="${c.img||''}" alt=""/><div class="ov"></div>
        <span class="lbl">${c.label}</span>
      </a>`).join('');
  }

  renderCategoryChrome();

  /* ── FILTER + SORT STATE ── */
  var state = { sort:'suggested', price:null, onSale:false, inStock:false, sizes:[], colors:[] };
  const PRICE_BANDS = [['Under MVR 1,000',0,1000],['MVR 1,000 – 3,000',1000,3000],['MVR 3,000 – 6,000',3000,6000],['Over MVR 6,000',6000,1e9]];

  function applyFilters(){
    let r = baseItems.slice();
    if (state.onSale) r = r.filter(p => p.old);
    if (state.inStock) r = r.filter(p => p.stock > 0);
    if (state.price) r = r.filter(p => p.price >= state.price[0] && p.price < state.price[1]);
    if (state.sizes.length) r = r.filter(p => p.sizes.some(s => state.sizes.includes(s)));
    if (state.colors.length) r = r.filter(p => p.colors.some(c => state.colors.includes(c)));
    if (state.sort==='newest') r.sort((a,b)=> (b.badge==='New')-(a.badge==='New'));
    else if (state.sort==='low') r.sort((a,b)=>a.price-b.price);
    else if (state.sort==='high') r.sort((a,b)=>b.price-a.price);
    return r;
  }

  function renderGrid(){
    const items = applyFilters();
    document.getElementById('count').textContent = items.length + ' product' + (items.length===1?'':'s');
    document.getElementById('grid').innerHTML = items.map(p => {
      const old = p.old ? `<span class="old">MVR ${p.old.toLocaleString()}</span>` : '';
      const badge = p.badge ? `<span class="pcard-badge ${p.bgold?'gold':''}">${p.badge}</span>` : '';
      return `<div class="pcard">
        <a href="post.html?id=${p.id}&cat=${p.cat}"><div class="pcard-img">${badge}<img src="${p.img}" alt="${p.name}"/></div></a>
        <div class="pcard-name-row">
          <a href="post.html?id=${p.id}&cat=${p.cat}" class="pcard-name">${p.name}</a>
          <button class="pcard-heart" onclick="toggleHeart(this)" title="Wishlist"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
        </div>
        <div class="pcard-price">MVR ${p.price.toLocaleString()}${old}</div>
        <div class="pcard-status ${p.sclass||''}">${p.status}</div>
      </div>`;
    }).join('') || `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem 1rem">No products match your filters.</div>`;
    // chip labels
    document.getElementById('chipPrice').textContent = state.price ? PRICE_BANDS.find(b=>b[1]===state.price[0])[0].replace('MVR ','MVR') : 'Price ▾';
    document.getElementById('chipSize').textContent = state.sizes.length ? 'Size · '+state.sizes.length : 'Size ▾';
    document.getElementById('chipStock').classList.toggle('active', state.inStock || state.onSale);
  }

  function toggleHeart(btn){ const on=btn.classList.toggle('saved'); showToast(on?'♥ Added to wishlist':'Removed from wishlist'); }

  /* ════════ SORT SHEET ════════ */
  const SORTS = [['suggested','Suggested products'],['newest','Newest'],['low','Price: low to high'],['high','Price: high to low']];
  function openSort(){
    sheet('Sort by', SORTS.map(([k,l])=>`<div class="sheet-opt" onclick="pickSort('${k}')"><span>${l}</span>
      <span class="radio ${state.sort===k?'on':''}"></span></div>`).join(''));
  }
  function pickSort(k){ state.sort=k; renderGrid(); closeSheet(); }

  /* ════════ FILTER SHEET ════════ */
  function openFilter(focus){
    const acc = (key,label,val,body)=>`<div class="acc" id="acc-${key}">
      <div class="acc-head" onclick="document.getElementById('acc-${key}').classList.toggle('open')">
        <span>${label}</span><span class="acc-val">${val} ›</span></div>
      <div class="acc-body">${body}</div></div>`;
    const chip = (arr,v)=>`<span class="fchip ${arr.includes(v)?'on':''}" onclick="togFilter('${arr===state.sizes?'sizes':'colors'}','${v}',this)">${v}</span>`;
    sheet('Filter',
      acc('color','Color', state.colors.length?state.colors.length+' selected':'All', `<div class="fchips">${COLORS.map(c=>chip(state.colors,c)).join('')}</div>`)+
      acc('size','Size', state.sizes.length?state.sizes.length+' selected':'All', `<div class="fchips">${SIZES.map(s=>chip(state.sizes,s)).join('')}</div>`)+
      acc('price','Price', state.price?'Selected':'All prices', `<div class="fchips col">${PRICE_BANDS.map((b,i)=>`<label class="frow-opt"><span>${b[0]}</span><input type="radio" name="pb" ${state.price&&state.price[0]===b[1]?'checked':''} onchange="state.price=[${b[1]},${b[2]}];updateLive()"/></label>`).join('')}<button class="link-clear" onclick="state.price=null;openFilter()">Clear price</button></div>`)+
      `<div class="frow-opt toggle-row"><span>On sale only</span><button class="tgl ${state.onSale?'on':''}" onclick="state.onSale=!state.onSale;this.classList.toggle('on');updateLive()"></button></div>`+
      `<div class="frow-opt toggle-row"><span>In stock</span><button class="tgl ${state.inStock?'on':''}" onclick="state.inStock=!state.inStock;this.classList.toggle('on');updateLive()"></button></div>`,
      `<button class="sheet-apply" onclick="applyAndClose()">View <span id="liveCount">${applyFilters().length}</span> products</button>`);
    if(focus) setTimeout(()=>document.getElementById('acc-'+focus)?.classList.add('open'),0);
  }
  function updateLive(){ const el=document.getElementById('liveCount'); if(el) el.textContent=applyFilters().length; }
  function togFilter(which,v,el){ const arr=state[which]; const i=arr.indexOf(v); if(i<0)arr.push(v);else arr.splice(i,1); el.classList.toggle('on'); updateLive(); }
  function applyAndClose(){ renderGrid(); closeSheet(); }

  /* ════════ GENERIC SHEET ════════ */
  function sheet(title, body, foot){
    let el = document.getElementById('sheet');
    el.querySelector('.sheet-title').textContent = title;
    el.querySelector('.sheet-body').innerHTML = body;
    el.querySelector('.sheet-foot').innerHTML = foot||'';
    document.getElementById('sheetBg').classList.add('show');
    el.classList.add('show');
  }
  function closeSheet(){ document.getElementById('sheetBg').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }

  renderGrid();
  window.addEventListener('kanxi:store-changed', () => {
    refreshBaseItems();
    renderCategoryChrome();
    renderGrid();
  });
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
