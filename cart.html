<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kanxi Collection — Shopping Bag</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f4f6;--panel:#fff;--soft:#f8fafc;--blue:#4f5cf0;--blue-dark:#4250ec}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    button,input{font:inherit}
    .app{max-width:480px;margin:0 auto;background:var(--panel);min-height:100vh;padding-bottom:150px;box-shadow:0 0 40px rgba(17,24,39,.08)}
    .head{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.75rem;padding:.95rem 1rem;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .icon-btn{width:42px;height:42px;border:none;background:none;border-radius:999px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
    .icon-btn:active{background:#f3f4f6}
    .title-wrap{flex:1}
    .title{font-size:1.02rem;font-weight:800}
    .subtitle{font-size:.82rem;color:var(--muted);margin-top:.1rem}
    .list{padding:1rem}
    .item{display:grid;grid-template-columns:112px 1fr;gap:1rem;padding:1rem;margin-bottom:1rem;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 10px 26px rgba(17,24,39,.04)}
    .item:last-child{margin-bottom:0}
    .item img{width:112px;height:112px;border-radius:20px;object-fit:cover;background:var(--soft)}
    .brand{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:#94a3b8;font-weight:700}
    .name{font-size:.94rem;font-weight:500;line-height:1.35;margin-top:.24rem}
    .meta{font-size:.8rem;color:var(--muted);margin-top:.3rem}
    .price{font-size:1rem;font-weight:700;margin-top:.7rem}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1rem}
    .qty{display:inline-flex;align-items:center;gap:.2rem;padding:.22rem;border:1px solid var(--line);border-radius:999px;background:#f8fafc}
    .qty button{width:34px;height:34px;border:none;background:#fff;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:0 1px 2px rgba(17,24,39,.08)}
    .qty button i{width:15px;height:15px}
    .qty span{min-width:22px;text-align:center;font-size:.84rem;font-weight:600}
    .remove{border:none;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;font-size:.8rem;font-weight:600}
    .summary{padding:0 1rem 1rem}
    .summary-card{border:1px solid var(--line);border-radius:24px;padding:1rem;background:#fff}
    .sum-row{display:flex;align-items:center;justify-content:space-between;font-size:.92rem;padding:.35rem 0;color:var(--muted)}
    .sum-row.total{margin-top:.55rem;padding-top:.8rem;border-top:1px solid var(--line);font-size:1.05rem;font-weight:800;color:var(--ink)}
    .promo{display:flex;gap:.6rem;margin-bottom:1rem}
    .promo input{flex:1;padding:.9rem 1rem;border:1px solid var(--line);border-radius:14px;outline:none}
    .promo button{padding:.9rem 1rem;border:none;border-radius:14px;background:#111827;color:#fff;font-weight:700;cursor:pointer}
    .bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:.9rem 1rem 1rem;z-index:60}
    .bar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
    .bar-label{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .bar-total{font-size:1.18rem;font-weight:800}
    .checkout{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;border:none;border-radius:18px;background:var(--blue);color:#fff;padding:1rem;font-size:1rem;font-weight:800;cursor:pointer}
    .checkout:hover{background:var(--blue-dark)}
    .empty{display:none;padding:5rem 2rem;text-align:center}
    .empty i{width:52px;height:52px;color:#94a3b8}
    .empty h2{font-size:1.35rem;font-weight:800;margin:1rem 0 .5rem}
    .empty p{font-size:.92rem;color:var(--muted);line-height:1.5;margin-bottom:1.3rem}
    .empty a{display:inline-flex;align-items:center;gap:.5rem;padding:.95rem 1.25rem;border-radius:16px;background:var(--blue);color:#fff;font-weight:800}
    .toast{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(2rem);background:#111827;color:#fff;padding:.8rem 1.2rem;border-radius:12px;font-size:.84rem;z-index:100;opacity:0;transition:.25s}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    @media (min-width:520px){body{padding:1.4rem 0}.app{border-radius:28px;min-height:auto}.bar{border-radius:0 0 28px 28px}}
  </style>
</head>
<body>
<div class="app">
  <div class="head">
    <button class="icon-btn" onclick="location.href='index.html'" aria-label="Back"><i data-lucide="chevron-left"></i></button>
    <div class="title-wrap">
      <div class="title">Shopping bag</div>
      <div class="subtitle" id="bagCount">0 items</div>
    </div>
    <button class="icon-btn" onclick="location.href='checkout.html'" aria-label="Checkout"><i data-lucide="shopping-bag"></i></button>
  </div>

  <div id="cartContent"></div>

  <div id="emptyState" class="empty">
    <i data-lucide="shopping-bag"></i>
    <h2>Your bag is empty</h2>
    <p>Add a few pieces you love and they’ll wait here for checkout.</p>
    <a href="index.html"><i data-lucide="arrow-right"></i><span>Start shopping</span></a>
  </div>
</div>

<div class="bar" id="checkoutBar" style="display:none">
  <div class="bar-top">
    <div>
      <div class="bar-label">Order total</div>
      <div class="bar-total" id="barTotal">MVR 0</div>
    </div>
  </div>
  <button class="checkout" onclick="goCheckout(event)"><i data-lucide="shield-check"></i><span>Checkout</span></button>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=1"></script>
<script src="assets/store.js?v=4"></script>
<script src="assets/components.js"></script>
<script>
  let discount = 0;

  function icons(){ if(window.lucide) lucide.createIcons(); }
  function money(n){ return 'MVR ' + (+n || 0).toLocaleString(); }
  function goCheckout(e){
    if(e) e.preventDefault();
    if(!refreshCartPrices().length){ showToast('Your bag is empty'); return; }
    if(typeof Store !== 'undefined' && !Store.currentUser()){
      showToast('Please sign in to continue');
      setTimeout(()=>location.href='login.html?redirect=checkout.html', 700);
      return;
    }
    location.href='checkout.html';
  }
  function render(){
    const cart = refreshCartPrices();
    const content = document.getElementById('cartContent');
    const empty = document.getElementById('emptyState');
    const bar = document.getElementById('checkoutBar');
    const count = cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById('bagCount').textContent = `${count} ${count===1?'item':'items'}`;

    if(!cart.length){
      content.innerHTML = '';
      empty.style.display = 'block';
      bar.style.display = 'none';
      icons();
      return;
    }

    empty.style.display = 'none';
    bar.style.display = 'block';

    const items = cart.map((it, idx)=>`
      <div class="item">
        <img src="${it.img||''}" alt=""/>
        <div>
          <div class="brand">${it.brand || 'Kanxi Collection'}</div>
          <div class="name">${it.name}</div>
          <div class="meta">${it.size ? 'Option: '+it.size : 'One Size'}</div>
          <div class="price">${money(it.price * it.qty)}</div>
          <div class="actions">
            <div class="qty">
              <button onclick="chg(${idx},-1)" aria-label="Decrease"><i data-lucide="minus"></i></button>
              <span>${it.qty}</span>
              <button onclick="chg(${idx},1)" aria-label="Increase"><i data-lucide="plus"></i></button>
            </div>
            <button class="remove" onclick="rm(${idx})"><i data-lucide="trash-2"></i><span>Remove</span></button>
          </div>
        </div>
      </div>
    `).join('');

    const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
    const shipping = 0;
    const tax = Math.round(subtotal * 0.08);
    const total = subtotal - discount + shipping + tax;

    content.innerHTML = `
      <div class="list">${items}</div>
      <div class="summary">
        <div class="summary-card">
          <div class="promo">
            <input id="promo" type="text" placeholder="Promo code (try KANXI10)"/>
            <button onclick="applyPromo()">Apply</button>
          </div>
          <div class="sum-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          ${discount ? `<div class="sum-row"><span>Discount</span><span style="color:#0f9f62;font-weight:700">- ${money(discount)}</span></div>` : ''}
          <div class="sum-row"><span>Shipping</span><span style="color:#0f9f62;font-weight:700">Free</span></div>
          <div class="sum-row"><span>Tax (8%)</span><span>${money(tax)}</span></div>
          <div class="sum-row total"><span>Total</span><span>${money(total)}</span></div>
        </div>
      </div>`;

    document.getElementById('barTotal').textContent = money(total);
    icons();
  }
  function chg(i,d){ const c=getCart(); c[i].qty=Math.max(1,c[i].qty+d); saveCart(c); render(); }
  function rm(i){ const c=getCart(); c.splice(i,1); saveCart(c); render(); }
  function applyPromo(){
    const v=(document.getElementById('promo')?.value || '').toUpperCase().trim();
    if(v==='KANXI10'){ discount=Math.round(refreshCartPrices().reduce((s,i)=>s+i.price*i.qty,0)*0.1); showToast('10% off applied'); render(); }
    else showToast('Invalid code');
  }
  render();
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
