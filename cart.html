<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kanxi Collection — Shopping Bag</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            ink: '#111827',
            muted: '#6b7280',
            line: '#e5e7eb',
            panel: '#ffffff',
            page: '#f3f4f6',
            soft: '#f8fafc',
            brand: '#4f5cf0',
            brandDark: '#4250ec'
          },
          boxShadow: {
            shell: '0 0 40px rgba(17,24,39,.08)',
            card: '0 10px 26px rgba(17,24,39,.04)'
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
    .toast{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(2rem);background:#111827;color:#fff;padding:.8rem 1.2rem;border-radius:12px;font-size:.84rem;z-index:100;opacity:0;transition:.25s}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  </style>
</head>
<body class="bg-page text-ink">
  <div class="mx-auto min-h-screen max-w-[480px] bg-panel pb-36 shadow-shell md:my-6 md:rounded-[28px]">
    <header class="sticky top-0 z-40 flex items-center gap-3 border-b border-line bg-white/95 px-4 py-4 backdrop-blur">
      <button class="grid h-11 w-11 place-items-center rounded-full text-ink transition active:bg-slate-100" onclick="location.href='index.html'" aria-label="Back">
        <i data-lucide="chevron-left" class="h-5 w-5"></i>
      </button>
      <div class="min-w-0 flex-1">
        <div class="text-[1.02rem] font-semibold tracking-[-0.01em]">Shopping bag</div>
        <div class="mt-0.5 text-sm text-muted" id="bagCount">0 items</div>
      </div>
      <button class="grid h-11 w-11 place-items-center rounded-full text-ink transition active:bg-slate-100" onclick="location.href='checkout.html'" aria-label="Checkout">
        <i data-lucide="shopping-bag" class="h-5 w-5"></i>
      </button>
    </header>

    <main id="cartContent"></main>

    <section id="emptyState" class="hidden px-8 py-24 text-center">
      <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-soft text-slate-400">
        <i data-lucide="shopping-bag" class="h-7 w-7"></i>
      </div>
      <h2 class="mt-4 text-[1.35rem] font-semibold tracking-[-0.01em]">Your bag is empty</h2>
      <p class="mx-auto mt-2 max-w-xs text-[0.92rem] leading-6 text-muted">Add a few pieces you love and they’ll wait here for checkout.</p>
      <a href="index.html" class="mt-5 inline-flex items-center gap-2 rounded-2xl bg-brand px-5 py-4 text-sm font-semibold text-white shadow-sm">
        <i data-lucide="arrow-right" class="h-4 w-4"></i>
        <span>Start shopping</span>
      </a>
    </section>
  </div>

  <div id="checkoutBar" class="fixed inset-x-0 bottom-0 z-50 mx-auto hidden w-full max-w-[480px] border-t border-line bg-white px-4 pb-4 pt-4 md:rounded-b-[28px]">
    <div class="mb-3 flex items-center justify-between">
      <div>
        <div class="text-[0.72rem] font-medium uppercase tracking-[0.16em] text-muted">Order total</div>
        <div class="mt-1 text-[1.18rem] font-semibold tracking-[-0.01em]" id="barTotal">MVR 0</div>
      </div>
    </div>
    <button class="flex w-full items-center justify-center gap-2 rounded-[18px] bg-brand px-4 py-4 text-base font-semibold text-white transition hover:bg-brandDark" onclick="goCheckout(event)">
      <i data-lucide="shield-check" class="h-5 w-5"></i>
      <span>Checkout</span>
    </button>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js?v=1"></script>
  <script src="assets/store.js?v=4"></script>
  <script src="assets/components.js"></script>
  <script>
    let discount = 0;

    function icons(){ if(window.lucide) lucide.createIcons(); }
    function money(n){ return 'MVR ' + (+n || 0).toLocaleString(); }
    function goCheckout(e){
      if(e) e.preventDefault();
      if(!refreshCartPrices().length){ showToast('Your bag is empty'); return; }
      if(typeof Store !== 'undefined' && !Store.currentUser()){
        showToast('Please sign in to continue');
        setTimeout(()=>location.href='login.html?redirect=checkout.html', 700);
        return;
      }
      location.href='checkout.html';
    }

    function render(){
      const cart = refreshCartPrices();
      const content = document.getElementById('cartContent');
      const empty = document.getElementById('emptyState');
      const bar = document.getElementById('checkoutBar');
      const count = cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById('bagCount').textContent = `${count} ${count===1?'item':'items'}`;

      if(!cart.length){
        content.innerHTML = '';
        empty.classList.remove('hidden');
        bar.classList.add('hidden');
        icons();
        return;
      }

      empty.classList.add('hidden');
      bar.classList.remove('hidden');

      const items = cart.map((it, idx)=>`
        <article class="grid grid-cols-[112px_minmax(0,1fr)] gap-4 rounded-[24px] border border-line bg-white p-4 shadow-card">
          <img src="${it.img||''}" alt="${it.name || ''}" class="h-28 w-28 rounded-[20px] bg-soft object-cover"/>
          <div class="min-w-0">
            <div class="text-[0.68rem] font-bold uppercase tracking-[0.18em] text-slate-400">${it.brand || 'Kanxi Collection'}</div>
            <div class="mt-1 text-[0.96rem] font-medium leading-6 text-ink">${it.name}</div>
            <div class="mt-1.5 text-[0.82rem] text-muted">${it.size ? 'Option: '+it.size : 'One Size'}</div>
            <div class="mt-3 text-base font-semibold text-ink">${money(it.price * it.qty)}</div>
            <div class="mt-4 flex items-center justify-between gap-3">
              <div class="inline-flex items-center gap-1 rounded-full border border-line bg-soft p-1">
                <button class="grid h-9 w-9 place-items-center rounded-full bg-white text-ink shadow-sm transition active:scale-95" onclick="chg(${idx},-1)" aria-label="Decrease">
                  <i data-lucide="minus" class="h-4 w-4"></i>
                </button>
                <span class="min-w-[26px] text-center text-sm font-medium text-ink">${it.qty}</span>
                <button class="grid h-9 w-9 place-items-center rounded-full bg-white text-ink shadow-sm transition active:scale-95" onclick="chg(${idx},1)" aria-label="Increase">
                  <i data-lucide="plus" class="h-4 w-4"></i>
                </button>
              </div>
              <button class="inline-flex items-center gap-1.5 text-[0.82rem] font-medium text-muted transition hover:text-ink" onclick="rm(${idx})">
                <i data-lucide="trash-2" class="h-4 w-4"></i>
                <span>Remove</span>
              </button>
            </div>
          </div>
        </article>
      `).join('');

      const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
      const shipping = 0;
      const tax = Math.round(subtotal * 0.08);
      const total = subtotal - discount + shipping + tax;

      content.innerHTML = `
        <div class="space-y-4 p-4">${items}</div>
        <div class="px-4 pb-6">
          <section class="rounded-[24px] border border-line bg-white p-4">
            <div class="mb-4 flex gap-2.5">
              <input id="promo" type="text" placeholder="Promo code (try KANXI10)" class="min-w-0 flex-1 rounded-2xl border border-line px-4 py-3.5 text-[0.95rem] outline-none transition focus:border-slate-400"/>
              <button onclick="applyPromo()" class="rounded-2xl bg-ink px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-slate-800">Apply</button>
            </div>
            <div class="space-y-2 text-[0.92rem] text-muted">
              <div class="flex items-center justify-between"><span>Subtotal</span><span>${money(subtotal)}</span></div>
              ${discount ? `<div class="flex items-center justify-between"><span>Discount</span><span class="font-semibold text-emerald-600">- ${money(discount)}</span></div>` : ''}
              <div class="flex items-center justify-between"><span>Shipping</span><span class="font-semibold text-emerald-600">Free</span></div>
              <div class="flex items-center justify-between"><span>Tax (8%)</span><span>${money(tax)}</span></div>
            </div>
            <div class="mt-4 flex items-center justify-between border-t border-line pt-4 text-[1.05rem] font-semibold text-ink">
              <span>Total</span>
              <span>${money(total)}</span>
            </div>
          </section>
        </div>`;

      document.getElementById('barTotal').textContent = money(total);
      icons();
    }

    function chg(i,d){ const c=getCart(); c[i].qty=Math.max(1,c[i].qty+d); saveCart(c); render(); }
    function rm(i){ const c=getCart(); c.splice(i,1); saveCart(c); render(); }
    function applyPromo(){
      const v=(document.getElementById('promo')?.value || '').toUpperCase().trim();
      if(v==='KANXI10'){ discount=Math.round(refreshCartPrices().reduce((s,i)=>s+i.price*i.qty,0)*0.1); showToast('10% off applied'); render(); }
      else showToast('Invalid code');
    }
    render();
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
