<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Kanxi Collection — Product</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --black:#1a1814; --white:#fff; --gray-100:#f8f5f1; --gray-200:#ede8e0; --gray-400:#b0a898; --gray-600:#6e6860; --accent:#b89b7a; --cream:#f5ede0; --ink:#1a1814; --muted:#8b8b8b; --line:#efefef; --red:#e0413b; --shop-blue:#4f5cf8; }
    body { font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:#e9e9e9; -webkit-font-smoothing:antialiased; }
    a { text-decoration:none; color:inherit; }
    .app { max-width:480px; margin:0 auto; background:#fff; min-height:100vh; box-shadow:0 0 40px rgba(0,0,0,0.08); padding-bottom:80px; }
    body.pending .hydrate-ready { visibility:hidden; }
    .loading-shell { display:none; padding:1rem; }
    body.pending .loading-shell { display:block; }
    .skeleton { background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 37%,#f3f4f6 63%); background-size:400% 100%; animation:shimmer 1.2s ease infinite; border-radius:14px; }
    .sk-img { aspect-ratio:1/1; }
    .sk-line { height:16px; margin-top:12px; }
    .sk-line.big { height:24px; width:78%; }
    .sk-line.mid { width:58%; }
    .sk-line.small { width:34%; }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:0 0} }

    /* header */
    .ph { position:sticky; top:0; z-index:50; background:#fff; display:flex; align-items:center; gap:0.75rem; padding:0.8rem 1rem; border-bottom:1px solid var(--line); }
    .icon-btn { background:none; border:none; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; line-height:1; width:28px; height:28px; padding:0; }
    .icon-btn svg { width:24px; height:24px; stroke-width:2.2; }
    .menu-btn { width:26px; height:26px; }
    .menu-btn svg { width:26px; height:26px; stroke-width:2.1; }
    .ph-avatar { width:30px; height:30px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--gray-200); flex-shrink:0; }
    .ph-avatar svg { height:21px; }
    .ph-meta { display:flex; flex-direction:column; line-height:1.15; }
    .ph-name { font-size:0.98rem; font-weight:700; display:flex; align-items:center; gap:4px; }
    .ph-name .verified { color:#3b82f6; font-size:0.78rem; }
    .view-shop { font-size:0.82rem; color:var(--shop-blue); font-weight:500; margin-top:0.15rem; }
    .spacer { flex:1; }
    .cart-wrap { position:relative; }
    .bag-btn { width:26px; height:26px; background:url('assets/bag-main.svg') center/contain no-repeat; transition:transform 0.15s; }
    .bag-btn:hover { transform:scale(1.08); }
    .cart-dot { position:absolute; top:-6px; right:-7px; background:var(--accent); color:#fff; font-size:0.56rem; font-weight:700; border-radius:50%; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

    /* gallery */
    .gallery { position:relative; }
    .gmain { height:min(52vh, 460px); background:var(--gray-100); overflow:hidden; }
    .gmain img { width:100%; height:100%; object-fit:cover; object-position:center; }
    .deal-ribbon { position:absolute; left:0; right:0; bottom:38px; display:flex; align-items:center; justify-content:space-between; padding:0.5rem 1rem; background:linear-gradient(90deg, rgba(224,65,59,0.92), rgba(184,155,122,0.0)); }
    .deal-ribbon .left { color:#fff; font-weight:800; font-size:0.9rem; display:flex; align-items:center; gap:0.3rem; }
    .deal-ribbon .right { color:#fff; font-weight:600; font-size:0.85rem; text-shadow:0 1px 3px rgba(0,0,0,0.3); }
    .gdots { position:absolute; bottom:14px; left:0; right:0; display:flex; gap:7px; justify-content:center; }
    .gdot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.75); }
    .gdot.active { background:#fff; }

    /* info */
    .info { padding:0.85rem 1rem 0; }
    .name-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.8rem; }
    .p-name { font-size:1.1rem; font-weight:700; line-height:1.28; flex:1; }
    .name-actions { display:flex; gap:0.9rem; flex-shrink:0; padding-top:2px; }
    .name-actions button { background:none; border:none; cursor:pointer; line-height:1; padding:0; width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
    .name-actions svg { width:23px; height:23px; }
    .name-actions .heart svg { fill:none; stroke:currentColor; transition:color 0.2s, transform 0.15s; display:block; }
    .name-actions .share svg, .name-actions .heart svg { stroke-width:2.1; }
    .name-actions .heart.saved { color:var(--red); }
    .name-actions .heart:active svg { transform:scale(1.12); }

    .p-price { font-size:1.48rem; font-weight:800; margin:0.45rem 0 0.8rem; }
    .p-price .old { font-size:1rem; font-weight:400; color:var(--gray-400); text-decoration:line-through; margin-left:0.5rem; }

    .opt { margin-bottom:1rem; }
    .opt-label { font-size:0.9rem; margin-bottom:0.5rem; }
    .opt-label b { font-weight:700; }
    .opt-label span { color:var(--gray-600); }
    .stock-note { display:block; margin-top:0.22rem; font-size:0.78rem; color:var(--gray-600); }
    .stock-note.low { color:var(--red); font-weight:600; }
    .swatches { display:flex; gap:0.6rem; overflow-x:auto; scrollbar-width:none; padding-bottom:0.15rem; }
    .swatches::-webkit-scrollbar { display:none; }
    .swatch { width:58px; cursor:pointer; }
    .swatch-img { width:58px; height:58px; border-radius:8px; overflow:hidden; border:1.5px solid var(--gray-200); }
    .swatch.active .swatch-img { border:2px solid var(--black); box-shadow:0 0 0 2px #fff inset; }
    .swatch-img img { width:100%; height:100%; object-fit:cover; }
    .swatch-lbl { font-size:0.68rem; text-align:center; margin-top:0.25rem; color:var(--gray-600); }
    .swatch-color { width:58px; height:58px; border-radius:8px; border:1.5px solid var(--gray-200); }
    .swatch.active .swatch-color { border:2px solid var(--black); }

    .sizes { display:flex; gap:0.6rem; overflow-x:auto; scrollbar-width:none; padding-bottom:0.1rem; }
    .sizes::-webkit-scrollbar { display:none; }
    .size { min-width:72px; text-align:center; padding:0.72rem 0; border:1.5px solid var(--gray-200); border-radius:10px; font-size:0.9rem; font-weight:600; cursor:pointer; transition:all 0.18s; background:#fff; }
    .size:hover { border-color:var(--black); }
    .size.active { background:#fff; color:var(--black); border:2px solid var(--black); box-shadow:0 0 0 2px #fff inset; }
    .size.sold, .swatch.sold { opacity:0.4; text-decoration:line-through; }
    .size.sold, .swatch.sold { cursor:not-allowed; }
    .swatch.sold { text-decoration:none; }
    .swatch.sold .swatch-lbl { text-decoration:line-through; }
    .swatch-stock { display:block; font-size:0.62rem; text-align:center; margin-top:0.16rem; color:var(--gray-600); }
    .swatch-stock.low { color:var(--red); font-weight:600; }
    .size-meta { display:block; font-size:0.68rem; line-height:1.15; margin-top:0.12rem; color:var(--gray-600); }
    .size.low .size-meta { color:var(--red); font-weight:600; }

    .deferred-section { content-visibility:auto; contain-intrinsic-size:700px; }
    .sec { padding:0 1rem; }
    .detail-block{padding:0 1rem 1rem}
    .detail-block h3{font-size:0.92rem;font-weight:700;margin-bottom:0.55rem}
    .detail-copy{font-size:0.9rem;color:var(--gray-600);line-height:1.7}
    .detail-list{margin-top:0.75rem;padding-left:1.1rem}
    .detail-list li{font-size:0.88rem;color:var(--gray-600);line-height:1.75}
    .related h3 { font-size:1rem; font-weight:800; margin-bottom:0.9rem; }
    .h-scroll { display:flex; gap:0.8rem; overflow-x:auto; scrollbar-width:none; }
    .h-scroll::-webkit-scrollbar { display:none; }
    .rcard { flex-shrink:0; width:42%; }
    .rcard-img { aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--gray-100); margin-bottom:0.4rem; border:1px solid #e3e3e3; }
    .rcard-img img { width:100%; height:100%; object-fit:cover; }
    .rcard-name { font-size:0.8rem; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .rcard-price { font-size:0.82rem; font-weight:700; margin-top:0.2rem; }

    /* bottom bar */
    .buy-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line); display:flex; gap:0.7rem; padding:0.9rem 1rem 1rem; z-index:60; }
    .buy-bar button { flex:1; border:none; border-radius:8px; min-height:56px; font-size:1rem; font-weight:700; cursor:pointer; padding:1rem 1.1rem; transition:all 0.2s; }
    .btn-cart { background:#eef2ff; color:#2f2f35; }
    .btn-cart:hover { background:#dbe4ff; color:#2f2f35; }
    .btn-buy { background:var(--shop-blue); color:#fff; }
    .btn-buy:hover { background:#4250f0; }
    .protect { text-align:center; font-size:0.8rem; font-weight:600; color:var(--gray-600); padding:0.6rem 0 0.2rem; }

    .toast { position:fixed; bottom:5.5rem; left:50%; transform:translateX(-50%) translateY(3rem); background:var(--black); color:#fff; padding:0.8rem 1.4rem; border-radius:10px; font-size:0.85rem; z-index:999; opacity:0; transition:all 0.3s; border-left:3px solid var(--accent); }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    @media (max-width:520px){
      .ph { padding:0.72rem 0.9rem; }
      .name-row { gap:0.65rem; }
      .p-name { font-size:1.02rem; line-height:1.22; }
      .name-actions { gap:0.75rem; }
      .detail-block{padding:0 1rem 0.85rem}
    }
    @media (min-width:520px){ body{padding:0;background:#fff;} .app{border-radius:0; min-height:100vh; box-shadow:none;} .buy-bar{border-radius:0;} }
  </style>
</head>
<body>
<div class="app">

  <!-- header -->
  <div class="ph">
    <button class="icon-btn" onclick="goBack()" title="Back"><i data-lucide="chevron-left"></i></button>
    <div class="ph-avatar">
      <svg viewBox="415 270 325 375" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,1254) scale(0.1,-0.1)" stroke="none"><path fill="#1a1814" d="M4477 9643 c-17 -16 -1 -20 91 -26 183 -11 246 -49 285 -171 l22 -71 0 -1290 c0 -1377 1 -1360 -48 -1448 -23 -42 -81 -80 -137 -93 -19 -4 -75 -10 -124 -13 -58 -4 -91 -10 -94 -18 -3 -10 109 -13 537 -13 307 0 542 4 545 9 8 13 -19 21 -73 21 -73 0 -151 27 -186 65 -17 18 -40 57 -51 86 -18 52 -19 95 -22 1334 -2 856 1 1306 8 1360 6 46 21 102 36 132 21 44 34 56 80 79 37 18 78 28 129 33 42 3 76 11 78 16 2 11 -1065 20 -1076 8z"/><g transform="translate(6350,7900) scale(0.78) translate(-6350,-7900)"><path fill="#b89b7a" d="M6540 9635 c0 -11 11 -15 38 -15 47 0 103 -28 121 -61 21 -38 7 -89 -43 -156 -59 -79 -554 -594 -1010 -1050 l-371 -373 81 0 81 0 234 -246 c129 -135 234 -249 234 -252 0 -4 -26 -59 -57 -122 -170 -343 -170 -724 -1 -1065 61 -123 121 -204 227 -310 175 -174 377 -281 656 -346 121 -29 425 -37 568 -15 264 40 518 170 666 340 55 63 106 135 106 148 0 20 -27 5 -49 -27 -33 -49 -157 -165 -227 -212 -266 -181 -601 -236 -926 -154 -385 97 -665 363 -807 765 -78 220 -90 520 -31 752 11 42 22 79 23 81 6 6 225 -220 714 -739 l73 -78 325 0 c196 0 325 4 325 9 0 6 -21 12 -47 16 -139 17 -227 50 -322 119 -60 45 -558 558 -885 913 l-49 53 29 42 c47 70 164 181 249 236 269 176 642 210 967 88 253 -95 464 -300 514 -498 9 -38 21 -68 26 -68 10 0 6 176 -8 362 l-6 77 -47 30 c-169 108 -391 183 -624 212 -123 15 -406 6 -502 -15 -251 -56 -463 -165 -644 -331 l-44 -40 -76 82 c-42 45 -146 157 -231 248 -85 91 -156 172 -158 178 -1 7 271 285 605 618 465 464 626 619 687 659 125 84 213 117 339 129 37 3 69 11 70 16 1 7 -137 11 -395 13 -350 2 -398 0 -398 -13z"/></g></g></svg>
    </div>
    <div class="ph-meta">
      <span class="ph-name">kanxi.collection <i data-lucide="badge-check" class="verified"></i></span>
      <a class="view-shop" href="index.html">View shop</a>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn cart-wrap" onclick="location.href='checkout.html'"><span class="bag-btn"></span><span class="cart-dot cart-count" style="display:none">0</span></button>
    <button class="icon-btn menu-btn" title="Menu"><i data-lucide="menu"></i></button>
  </div>

  <!-- gallery -->
  <div class="loading-shell">
    <div class="skeleton sk-img"></div>
    <div class="skeleton sk-line big"></div>
    <div class="skeleton sk-line mid"></div>
    <div class="skeleton sk-line small"></div>
  </div>

  <div class="gallery hydrate-ready">
    <div class="gmain"><img id="mainImg" src="" alt="" fetchpriority="high" decoding="sync"/></div>
    <div class="deal-ribbon" id="ribbon">
      <span class="left">🔥 Hot Deal</span>
      <span class="right">Limited offer</span>
    </div>
    <div class="gdots" id="dots"></div>
  </div>

  <!-- info -->
  <div class="info hydrate-ready">
    <div class="name-row">
      <h1 class="p-name" id="pName">Product</h1>
      <div class="name-actions">
        <button class="share" onclick="shareIt()" title="Share"><i data-lucide="send"></i></button>
        <button class="heart" id="heartBtn" onclick="toggleHeart()" title="Wishlist"><i data-lucide="bookmark"></i></button>
      </div>
    </div>
    <div class="p-price" id="pPrice"></div>

    <div class="opt" id="shadeOpt" style="display:none">
      <div class="opt-label"><b id="shadeLabel">Shade:</b> <span id="colorSel"></span></div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="opt" id="sizeOpt" style="display:none">
      <div class="opt-label"><b id="sizeLabel">Size:</b> <span id="sizeSel"></span></div>
      <div class="sizes" id="sizes"></div>
    </div>
  </div>

  <div class="detail-block hydrate-ready" id="productDetails"></div>

  <!-- related -->
  <div class="sec related deferred-section hydrate-ready">
    <h3>More like this</h3>
    <div class="h-scroll" id="related"></div>
  </div>

  <p class="protect hydrate-ready">Buyer Protection Program</p>

</div>

<!-- bottom bar -->
<div class="buy-bar">
  <button class="btn-cart" onclick="doAddToCart()">Add to cart</button>
  <button class="btn-buy" onclick="doBuyNow()">Buy now</button>
</div>

<script src="assets/icons.js?v=2"></script>
<script src="assets/supabase-config.js?v=2"></script>
<script src="assets/store.js?v=16"></script>
<script src="assets/components.js?v=2"></script>
<script>
  document.body.classList.add('pending');
  function goBack(){ if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) history.back(); else location.href = 'index.html'; }

  const id = new URLSearchParams(location.search).get('id');
  let sp = null, c = null, imgs = [], selVar = null;
  function variantGallery(variant){
    const base = (c && c.images && c.images.length) ? c.images.slice() : [c && c.img].filter(Boolean);
    if(!variant) return base;
    const own = (Array.isArray(variant.images) ? variant.images : [variant.image]).filter(Boolean);
    if(!own.length) return base;
    const seen = new Set();
    return own.concat(base).filter(src => {
      const key = String(src || '');
      if(!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }
  function setGallery(activeIndex=0){
    imgs = variantGallery(selVar);
    gi = Math.min(Math.max(0, activeIndex), Math.max(0, imgs.length - 1));
    const mainImg = document.getElementById('mainImg');
    mainImg.src = imgs[gi] || c.img;
    mainImg.alt = c.name;
    document.getElementById('dots').innerHTML = imgs.map((_,i)=>`<span class="gdot ${i===gi?'active':''}"></span>`).join('');
  }

  function formatPrice(price, old){
    return 'MVR ' + Number(price || 0).toLocaleString() + (old ? `<span class="old">MVR ${Number(old).toLocaleString()}</span>` : '');
  }

  function renderPrice(){
    const vp = selVar ? Store.priceOfVariant(sp.id, selVar.id) : null;
    document.getElementById('pPrice').innerHTML = formatPrice(vp || c.price, c.old);
  }
  function stockTextFor(count){
    const stock = Math.max(0, Number(count || 0));
    if (stock <= 0) return 'Out of stock';
    if (stock === 1) return '1 left';
    return `${stock} left`;
  }
  function activeVariantStock(){
    if(!sp) return 0;
    if(selVar) return Store.availableStockOfVariant(sp.id, selVar.id);
    return Store.availableStockOf(sp.id);
  }
  function renderSelectionState(){
    const vt = sp.variantType || 'none';
    const stock = activeVariantStock();
    const stockHtml = `<small class="stock-note ${stock > 0 && stock <= 3 ? 'low' : ''}">${stockTextFor(stock)}</small>`;
    if (vt === 'shade') {
      document.getElementById('colorSel').innerHTML = `${selVar ? selVar.value : ''}${stockHtml}`;
    } else if (vt === 'size' || vt === 'volume') {
      document.getElementById('sizeSel').innerHTML = `${selVar ? selVar.value : ''}${stockHtml}`;
    }
    const cartBtn = document.querySelector('.btn-cart');
    const buyBtn = document.querySelector('.btn-buy');
    const disabled = stock <= 0;
    [cartBtn, buyBtn].forEach(btn => {
      if(!btn) return;
      btn.disabled = disabled;
      btn.style.opacity = disabled ? '0.55' : '1';
      btn.style.cursor = disabled ? 'not-allowed' : 'pointer';
    });
  }

  let gi = 0;
  function renderProductPage(){
    sp = Store.get('products', id) || Store.storeProducts()[0] || null;
    if(!sp) return false;
    c = Store.card(sp);
    selVar = (sp.variants || []).find(v => Store.availableStockOfVariant(sp.id, v.id) > 0) || (sp.variants && sp.variants[0]) || null;
    gi = 0;
    setGallery(0);
    document.getElementById('pName').textContent = c.name;
    renderPrice();
    const detailWrap = document.getElementById('productDetails');
    const detailItems = (sp.details || []).filter(Boolean);
    if (detailWrap) {
      if ((sp.description || '').trim() || detailItems.length) {
        detailWrap.style.display = '';
        detailWrap.innerHTML = `
          <h3>Product details</h3>
          ${(sp.description || '').trim() ? `<p class="detail-copy">${sp.description}</p>` : ''}
          ${detailItems.length ? `<ul class="detail-list">${detailItems.map(item=>`<li>${item}</li>`).join('')}</ul>` : ''}
        `;
      } else {
        detailWrap.style.display = 'none';
        detailWrap.innerHTML = '';
      }
    }
    document.getElementById('ribbon').style.display = c.old ? '' : 'none';

    const vt = sp.variantType || 'none';
    const opts = sp.variants || [];
    const shadeOpt = document.getElementById('shadeOpt');
    const sizeOpt = document.getElementById('sizeOpt');
    shadeOpt.style.display = 'none';
    sizeOpt.style.display = 'none';
    document.getElementById('swatches').innerHTML = '';
    document.getElementById('sizes').innerHTML = '';

    if (vt === 'shade') {
      shadeOpt.style.display='';
      document.getElementById('shadeLabel').textContent = 'Shade:';
      document.getElementById('swatches').innerHTML = opts.map((v,i)=>{
        const st = Store.availableStockOfVariant(sp.id, v.id);
        const preview = (Array.isArray(v.images) && v.images[0]) || v.image || c.img;
        const isActive = selVar && selVar.id === v.id;
        return `<div class="swatch ${isActive?'active':''} ${st===0?'sold':''} ${st>0 && st<=3?'low':''}" onclick="pickVar('${v.id}',this)">
          <div class="swatch-img">${preview?`<img src="${preview}" alt="${v.value}" loading="lazy" decoding="async"/>`:`<div class="swatch-color" style="background:${v.color||'#ddd'}"></div>`}</div>
          <div class="swatch-lbl">${v.value}</div>
          <small class="swatch-stock ${st>0 && st<=3?'low':''}">${stockTextFor(st)}</small></div>`;
      }).join('');
    } else if (vt === 'size' || vt === 'volume') {
      sizeOpt.style.display='';
      document.getElementById('sizeLabel').textContent = (vt==='size'?'Size:':'Volume:');
      document.getElementById('sizes').innerHTML = opts.map((v,i)=>{
        const st = Store.availableStockOfVariant(sp.id, v.id);
        const isActive = selVar && selVar.id === v.id;
        return `<div class="size ${isActive?'active':''} ${st===0?'sold':''} ${st>0 && st<=3?'low':''}" onclick="pickVar('${v.id}',this)">${v.value}<small class="size-meta">${stockTextFor(st)}</small></div>`;
      }).join('');
    }
    renderSelectionState();

    const related = Store.cardsBySlug(c.cat).filter(x=>x.id!==id).slice(0,6);
    document.getElementById('related').innerHTML = related.map((r, i)=>
      `<a class="rcard" href="post.html?id=${r.id}">
        <div class="rcard-img"><img src="${r.img}" alt="${r.name}" ${i < 2 ? 'loading="eager" fetchpriority="high" decoding="async"' : 'loading="lazy" fetchpriority="low" decoding="async"'} /></div>
        <p class="rcard-name">${r.brand} ${r.name}</p>
        <p class="rcard-price">MVR ${r.price.toLocaleString()}</p></a>`).join('');

    document.body.classList.remove('pending');
    if (window.lucide) lucide.createIcons();
    return true;
  }

  function pickVar(vid, el){
    const opts = sp.variants || [];
    const vt = sp.variantType || 'none';
    const next = opts.find(v=>v.id===vid);
    if(!next) return;
    const stock = Store.availableStockOfVariant(sp.id, next.id);
    if(stock <= 0){
      showToast('This variant is out of stock');
      return;
    }
    selVar = next;
    el.parentElement.querySelectorAll('.swatch,.size').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    setGallery(0);
    renderPrice();
    renderSelectionState();
  }

  /* ── heart + share ── */
  function toggleHeart(){ const on=document.getElementById('heartBtn').classList.toggle('saved'); showToast(on?'♥ Added to wishlist':'Removed from wishlist'); }
  function shareIt(){ showToast('Link copied to share'); }

  /* ── cart ── */
  function curPrice(){ return (selVar && Store.priceOfVariant(sp.id, selVar.id)) || (c && c.price) || 0; }
  function doAddToCart(){
    if(!sp || !c) return;
    const vt = sp.variantType || 'none';
    const variantLabel = selVar ? (Store.variantTypeLabel(vt)+': '+selVar.value) : 'One Size';
    if ((vt!=='none') && !selVar) { showToast('Please select an option'); return false; }
    const stock = activeVariantStock();
    if(stock <= 0){ showToast('This variant is out of stock'); return false; }
    return addToCart({ id:id + (selVar?('_'+selVar.id):''), name:c.brand+' '+c.name, price:curPrice(), size:variantLabel, img:(variantGallery(selVar)[0] || c.img) });
  }
  function doBuyNow(){ if(doAddToCart()) setTimeout(()=>location.href='checkout.html', 500); }
  document.querySelector('.gmain').addEventListener('click', () => {
    if (imgs.length > 1) {
      gi = (gi+1) % imgs.length;
      const mainImg = document.getElementById('mainImg');
      mainImg.src = imgs[gi];
      document.querySelectorAll('.gdot').forEach((d,i)=>d.classList.toggle('active', i===gi));
    }
  });
  if (!renderProductPage() && location.protocol !== 'file:') {
    Store.syncFromCloud().finally(() => renderProductPage());
  }
  window.addEventListener('kanxi:store-changed', () => { renderProductPage(); });
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
